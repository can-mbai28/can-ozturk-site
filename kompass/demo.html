  // ---------- Who did you meet? ----------
  KC.screen("whomet", {
    tab: null,
    render(params, el) {
      const ev = evById(params.event);
      const selected = new Set();
      const unmet = ev.attendees.filter((id) => !S.isMet(id) && S.visible(id));
      const fromList = unmet.filter((id) => S.onList(id));
      const others = unmet.filter((id) => !S.onList(id));
      let query = "", justToggled = null;

      const face = (id) => {
        const p = D.byId[id], sel = selected.has(id);
        return `<button class="face ${sel ? "sel" : ""}" data-f="${id}" aria-pressed="${sel}">
          ${avatar(p, 64, { forceColor: sel, ring: sel, cls: sel && id === justToggled ? "unlock" : "" })}<span>${esc(p.first)}</span></button>`;
      };
      const filt = (ids) => ids.filter((id) => D.byId[id].name.toLowerCase().includes(query));

      el.innerHTML = `
        <button class="back" id="back">‹ Events</button>
        <div style="padding:8px 20px 8px">
          <div style="font-size:13px;font-weight:700;color:var(--pink-ink)">${esc(ev.title)} · yesterday</div>
          <h1 style="font-size:28px;margin-top:4px">Who did you meet?</h1>
          <div class="sub">Only people who went and you haven't met yet. Your list first.</div>
        </div>
        <div style="padding:8px 20px">
          <label for="search" style="position:absolute;left:-9999px">Search by name</label>
          <input id="search" class="search" placeholder="Met someone else? Search by name" autocomplete="off">
        </div>
        <div id="grids" class="grow"></div>
        <div class="sticky-bottom" style="padding:12px 20px 24px;display:flex;gap:10px">
          <button class="btn ghost" id="skip">Skip</button>
          <button class="btn primary" style="flex-grow:1" id="unlock" disabled>Tap who you met</button>
        </div>`;

      const grids = el.querySelector("#grids"), unlockBtn = el.querySelector("#unlock");
      function draw() {
        const a = filt(fromList), b = filt(others);
        const elsewhere = query.length > 1 ? D.STUDENTS.filter((p) => !S.isMet(p.id) && S.visible(p.id) && !ev.attendees.includes(p.id) && p.name.toLowerCase().includes(query)).slice(0, 8).map((p) => p.id) : [];
        grids.innerHTML =
          (a.length ? `<div class="pad caps" style="padding-top:8px">FROM YOUR LIST</div><div class="grid4">${a.map(face).join("")}</div>` : "") +
          (b.length ? `<div class="pad caps" style="padding-top:8px">ALSO THERE · ${b.length} MORE</div><div class="grid4">${b.map(face).join("")}</div>` : "") +
          (elsewhere.length ? `<div class="pad caps" style="padding-top:8px">ELSEWHERE IN CLASS</div><div class="grid4">${elsewhere.map(face).join("")}</div>` : "") +
          (!a.length && !b.length && !elsewhere.length ? `<div class="empty">No one by that name.</div>` : "");
        grids.querySelectorAll("[data-f]").forEach((btn) => btn.addEventListener("click", () => {
          const id = btn.dataset.f;
          selected.has(id) ? selected.delete(id) : selected.add(id);
          justToggled = id;
          draw();
        }));
        unlockBtn.disabled = !selected.size;
        unlockBtn.textContent = selected.size ? `Unlock ${selected.size} ${KC.peopleWord(selected.size)}` : "Tap who you met";
      }
      draw();

      el.querySelector("#search").addEventListener("input", (e) => { query = e.target.value.trim().toLowerCase(); draw(); });
      el.querySelector("#back").addEventListener("click", KC.back);
      el.querySelector("#skip").addEventListener("click", () => KC.tab("events"));
      unlockBtn.addEventListener("click", () => {
        const ids = [...selected];
        ids.forEach((id) => S.markMet(id, "at " + ev.title));
        KC.burst(unlockBtn);
        KC.toast(`Unlocked ${ids.length} · You've met ${S.metCount()} of ${D.CLASS_SIZE}`);
        setTimeout(() => KC.go("swipe", { ids, i: 0 }, { replace: true }), 500);
      });
    },
  });

  // ---------- Keep in touch? (swipe) ----------
  KC.screen("swipe", {
    tab: null,
    render(params, el) {
      const { ids } = params, i = params.i || 0;
      const p = D.byId[ids[i]];
      const note = S.state.notes[p.id];
      el.innerHTML = `
        <div style="padding:12px 20px 8px;display:flex;justify-content:space-between;align-items:baseline">
          <h1 style="font-size:28px">Keep in touch?</h1><div style="font-size:13px;color:var(--muted)">${i + 1} of ${ids.length}</div>
        </div>
        <div class="pad" style="font-size:14px;color:var(--muted)">Nobody sees how you swipe.</div>
        <div class="deck">
          ${i < ids.length - 1 ? `<div class="behind"></div>` : ""}
          <div class="scard" id="card">
            <span class="stamp keep" id="st-keep">KEEP IN TOUCH</span><span class="stamp nice" id="st-nice">NICE TO MEET</span>
            <div class="hero" style="background:${p.color}">${esc(p.initials)}</div>
            <div style="padding:18px;display:flex;flex-direction:column;gap:8px">
              <h2 style="font-size:24px">${esc(p.name)}</h2>
              <div style="font-size:13px;color:var(--muted)">${esc(p.program)} · ${esc(p.section)} · ${esc(KC.prevLabel(p))}</div>
              <div style="background:var(--ivory);border-radius:12px;padding:10px 12px;font-size:13px">
                ${note ? `<div class="caps">Your note</div>${esc(note)}`
                       : `<div class="caps">Open to chat about</div>${esc(p.openTo.join(", "))}`}
              </div>
            </div>
          </div>
        </div>
        <div style="padding:0 20px 8px;display:flex;gap:12px">
          <button class="choice" id="nice" style="border:1.5px solid var(--line-2);background:#fff;color:var(--ink)"><span>Nice to meet</span><small style="color:var(--muted)">Stays in network</small></button>
          <button class="choice" id="keep" style="border:none;background:var(--purple);color:#fff"><span>Keep in touch</span><small style="color:#E2DAF0">I'll remind you</small></button>
        </div>
        <div style="padding:0 20px 24px;text-align:center;font-size:12px;color:var(--muted)">Swipe right to keep in touch, left for nice to meet</div>`;

      const card = el.querySelector("#card"), stK = el.querySelector("#st-keep"), stN = el.querySelector("#st-nice");
      let done = false;
      function decide(status) {
        if (done) return; done = true;
        S.setStatus(p.id, status);
        if (status === "keep") KC.ensureThread(p.id);
        const dir = status === "keep" ? 1 : -1;
        card.classList.remove("drag"); card.classList.add("fly");
        card.style.transform = `translateX(${dir * 480}px) rotate(${dir * 24}deg)`;
        card.style.opacity = "0";
        setTimeout(() => {
          if (i + 1 < ids.length) return KC.go("swipe", { ids, i: i + 1 }, { replace: true });
          const kept = ids.filter((id) => S.state.met[id] && S.state.met[id].status === "keep");
          if (kept.length) { KC.tab("chats"); KC.toast(`I drafted ${kept.length === 1 ? "a follow-up" : kept.length + " follow-ups"} for you`); }
          else { KC.tab("events"); KC.toast("Saved. They stay in your network."); }
        }, 320);
      }
      el.querySelector("#keep").addEventListener("click", () => decide("keep"));
      el.querySelector("#nice").addEventListener("click", () => decide("nice"));

      // Drag to swipe.
      let startX = null, dx = 0;
      card.addEventListener("pointerdown", (e) => { startX = e.clientX; dx = 0; card.classList.add("drag"); card.setPointerCapture(e.pointerId); });
      card.addEventListener("pointermove", (e) => {
        if (startX === null) return;
        dx = e.clientX - startX;
        card.style.transform = `translateX(${dx}px) rotate(${3 + dx / 18}deg)`;
        stK.style.opacity = Math.max(0, Math.min(1, dx / 90));
        stN.style.opacity = Math.max(0, Math.min(1, -dx / 90));
      });
      const end = () => {
        if (startX === null) return; startX = null;
        if (dx > 90) decide("keep");
        else if (dx < -90) decide("nice");
        else { card.classList.remove("drag"); card.classList.add("fly"); card.style.transform = ""; stK.style.opacity = stN.style.opacity = 0; setTimeout(() => card.classList.remove("fly"), 350); }
      };
      card.addEventListener("pointerup", end);
      card.addEventListener("pointercancel", end);
      el.addEventListener("keydown", (e) => { if (e.key === "ArrowRight") decide("keep"); if (e.key === "ArrowLeft") decide("nice"); });
    },
  });

                <div style="font-size:13px;color:${last ? "var(--muted)" : "var(--pink-ink)"};${last ? "" : "font-weight:700;"}white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${last ? esc((last.from === "me" ? "You: " : "") + last.text) : "Draft ready · time to follow up"}</div></div></button>`;
          }).join("") : `<div class="empty"><h2>No follow-ups yet</h2>After an event, tell me who you met and swipe <strong>Keep in touch</strong>. I'll draft the message and find a time you're both free.</div>`}
        </div>`;
      el.querySelectorAll("[data-t]").forEach((b) => b.addEventListener("click", () => KC.go("chat", { id: b.dataset.t })));
      el.querySelectorAll("[data-net]").forEach((b) => b.addEventListener("click", () => KC.go("mypeople", { seg: b.dataset.net })));
      KC.wireAgentPanel(el);
      KC.agentMaybeRun();
    },
  });

  // ---------- Week view: your calendar vs. their free/busy ----------
  const hourLabel = (h) => (h === 12 ? "12 PM" : h > 12 ? h - 12 + " PM" : h + " AM");
  function weekView(p, t, onPick) {
    const days = Object.keys(D.MY_CALENDAR), hours = [9, 10, 11, 12, 13, 14, 15, 16, 17];
    const cells = hours.map((h) => `<div class="h">${hourLabel(h).replace(" ", "").toLowerCase()}</div>` + days.map((d) => {
      const slot = `${d} ${hourLabel(h)}`;
      if (D.FREE_SLOTS.includes(slot)) return `<button class="c both ${t.slot === slot ? "on" : ""}" data-pick="${slot}">Free for both</button>`;
      if (D.MY_CALENDAR[d][h]) return `<div class="c mine">${esc(D.MY_CALENDAR[d][h])}</div>`;
      if (D.THEIR_BUSY[d].includes(h)) return `<div class="c theirs">${esc(p.first)} busy</div>`;
      return `<div class="c free"></div>`;
    }).join("")).join("");
    KC.sheet("This week", `
      <div class="legend"><span><i style="background:#E9E5EE"></i>You</span><span><i style="background:repeating-linear-gradient(45deg,#F3F1F6,#F3F1F6 3px,#E9E5EE 3px,#E9E5EE 6px)"></i>${esc(p.first)} busy</span><span><i style="background:var(--purple)"></i>Free for both</span></div>
      <div class="week"><div></div>${days.map((d) => `<div class="d">${d}</div>`).join("")}${cells}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:12px">From your Google Calendar. ${esc(p.first)} only shares free/busy.</div>`,
      (b, close) => b.querySelectorAll("[data-pick]").forEach((x) => x.addEventListener("click", () => { close(); onPick(x.dataset.pick); })));
  }

  // ---------- Follow-up chat ----------
  KC.screen("chat", {
    tab: null,
    render(params, el) {
      const p = D.byId[params.id], t = KC.ensureThread(p.id);
      const m = S.state.met[p.id];
      const sent = t.messages.length > 0, restricted = S.isRestricted(p.id);
      const aiDraft = draftFor(p.id, t.slot);

      const setSlot = (slot) => {
        const ta = el.querySelector("#draft"), cur = ta ? ta.value : t.draft;
        const oldAsk = askFor(t.slot);
        t.slot = slot;
        t.draft = cur.includes(oldAsk) ? cur.replace(oldAsk, askFor(slot)) : cur;
        S.save(); KC.go("chat", { id: p.id }, { replace: true });
      };

      let schedule = "";
      if (!sent && !restricted) {
        schedule = !S.state.calendar
          ? `<div class="card cal-card"><div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></div>
              <div style="flex-grow:1;font-size:13px;line-height:1.35"><strong>Find a time you're both free</strong><br><span style="color:var(--muted)">Connect Google Calendar</span></div>
              <button class="btn primary small" id="connect">Connect</button></div>`
          : `<div style="padding:0 20px 10px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                <div class="caps">Free for both of you</div><button class="linkbtn" style="font-size:13px;min-height:28px;padding:0" id="week">View my calendar</button></div>
              <div style="display:flex;gap:8px">${D.FREE_SLOTS.map((sl) => `<button class="slot ${sl === t.slot ? "on" : ""}" data-slot="${sl}" aria-pressed="${sl === t.slot}">${sl}</button>`).join("")}</div></div>`;
      }

      el.style.background = "var(--ivory)";
      el.innerHTML = `
        <div class="chat-head">
          <button class="back" id="back" style="position:static;padding:0 6px 0 0;font-size:28px;line-height:1" aria-label="Back">‹</button>
          <button style="border:none;background:none;padding:0;display:flex;gap:12px;align-items:center;text-align:left;flex-grow:1" id="who">${avatar(p, 44)}
            <div><div style="font-weight:700;font-size:16px">${esc(p.name)}</div>
            <div style="font-size:12px;color:var(--muted)">${m ? "Met " + esc(m.at) : ""}</div></div></button>
          ${KC.dotsBtn()}
        </div>
        ${restricted ? `<div class="banner warn">This account is restricted by Kellogg's safety team. You can't message ${esc(p.first)}.</div>` : ""}
        ${sent || restricted ? "" : `<div class="nudge"><div style="font-weight:700;color:var(--purple);font-size:14px">Time to follow up</div>
          <div style="font-size:13px;color:var(--ink-2);margin-top:2px">You wanted to keep in touch with ${esc(p.first)}. I drafted a message.</div></div>`}
        <div class="msgs" id="msgs">${t.messages.map((x) => `<div class="msg ${x.from}">${esc(x.text)}</div>${x.meta ? `<div class="msg-meta">${esc(x.meta)}</div>` : ""}`).join("")}</div>
        ${schedule}
        ${restricted ? `<div style="height:24px"></div>` : `<div class="composer">
          <label for="draft" style="font-size:12px;font-weight:700;color:var(--purple)">${sent ? "Message" : "Draft · edit anything"}</label>
          <textarea id="draft" style="${sent ? "height:56px" : ""}" placeholder="${sent ? "" : "Write your own message"}">${sent ? "" : esc(t.draft)}</textarea>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>${sent ? "" : `<button class="tool" id="clear">Clear</button><button class="tool" id="redraft">↻ Redraft</button>`}</div>
            <button class="btn primary small" id="send" style="padding:0 22px">Send</button></div>
        </div>`}`;

      el.querySelector("#msgs").scrollIntoView({ block: "end" });
      el.querySelector("#back").addEventListener("click", () => KC.tab("chats"));
      el.querySelector("#who").addEventListener("click", () => KC.go("profile", { id: p.id }));
      el.querySelector("#dots").addEventListener("click", () => KC.personMenu(p.id, "chat"));
      const connect = el.querySelector("#connect");
      if (connect) connect.addEventListener("click", () => KC.connectCalendar(() => setSlot(D.FREE_SLOTS[1])));
      const week = el.querySelector("#week");
      if (week) week.addEventListener("click", () => weekView(p, t, setSlot));
      el.querySelectorAll("[data-slot]").forEach((b) => b.addEventListener("click", () => setSlot(b.dataset.slot)));
      if (restricted) return;

      const ta = el.querySelector("#draft"), clear = el.querySelector("#clear"), redraft = el.querySelector("#redraft");
      const syncTools = () => {
        if (clear) clear.style.visibility = ta.value ? "visible" : "hidden";
        if (redraft) redraft.style.visibility = ta.value !== aiDraft ? "visible" : "hidden";
      };
      syncTools();
      ta.addEventListener("input", () => { if (!sent) { t.draft = ta.value; S.save(); } syncTools(); });
      if (clear) clear.addEventListener("click", () => { ta.value = ""; t.draft = ""; S.save(); syncTools(); ta.focus(); });
      if (redraft) redraft.addEventListener("click", () => { ta.value = t.draft = draftFor(p.id, t.slot); S.save(); syncTools(); });
      el.querySelector("#send").addEventListener("click", () => {
        const text = ta.value.trim();
        if (!text) { ta.focus(); return; }
        const meta = sent ? "" : t.slot && text.includes(t.slot) ? `Sent · Added to your calendar: ${t.slot}` : "Sent";
        t.messages.push({ from: "me", text, meta, at: S.now() });
        S.touch(p.id);
        KC.go("chat", { id: p.id }, { replace: true });
        if (!sent) setTimeout(() => {
          const reply = t.slot && text.includes(t.slot) ? `${t.slot.split(" ")[0]} works! See you then 🙌` : "Would love that! Let's find a time this week.";
          t.messages.push({ from: "them", text: reply });
          S.save();
          const head = document.querySelector("#who");
          if (head && head.textContent.includes(p.name)) KC.go("chat", { id: p.id }, { replace: true });
        }, 1800);
      });
    },
  });
})();

</script>
  <script>
/* profile.js */
// profile.js: build your own profile (onboarding), "My profile" settings,
// blocked people, and connecting Google Calendar (faked).

(function () {
  const { D, S, esc, avatar } = window.KC;
  const O = D.OPTIONS;
  const MAX_TOPICS = 3;
  let draft = null; // profile being edited

  const STEPS = [
    { title: "About you", sub: "Pre-filled from your Kellogg sign-in. Fix anything that's off." },
    { title: "Where you fit", sub: "Classmates can find you by section and KWEST trip. Optional." },
    { title: "What you're into", sub: "Pick clubs and hobbies. This powers “In common”. Optional." },
    { title: "Open to chat about", sub: `Pick up to ${MAX_TOPICS}, or leave it empty. These are the first thing people see.` },
    { title: "How classmates see you", sub: "Gray until you meet. Your photo, contact info and notes unlock in person." },
  ];

  const pickRow = (field, values, multi, max) => `<div class="wrap">${values.map((v) => {
    const on = multi ? draft[field].includes(v) : draft[field] === v;
    const full = multi && max && !on && draft[field].length >= max;
    return `<button class="pick ${on ? "on" : ""}" data-field="${field}" data-v="${esc(v)}" data-multi="${multi ? 1 : ""}" data-max="${max || ""}" aria-pressed="${on}" ${full ? "disabled" : ""}>${esc(v)}</button>`;
  }).join("")}</div>`;

  function suggestedTopics() {
    const s = new Set();
    if (draft.kwest && draft.kwest !== D.NO_KWEST) s.add(draft.kwest + " trip");
    O.topics.forEach((t) => s.add(t));
    draft.openTo.forEach((t) => s.add(t));
    return Array.from(s);
  }

  function stepBody(step) {
    if (step === 1) return `
      <div class="ob-section"><div class="label">First name</div><input class="field" id="f-first" value="${esc(draft.first)}" autocomplete="given-name"></div>
      <div class="ob-section"><div class="label">Last name</div><input class="field" id="f-last" value="${esc(draft.last)}" autocomplete="family-name"></div>
      <div class="ob-section"><div class="label">Program</div>${pickRow("program", O.programs)}</div>
      <div class="ob-section"><div class="label">Career interest</div>${pickRow("career", O.careers)}</div>`;
    if (step === 2) return `
      <div class="ob-section"><div class="label">Section</div>${pickRow("section", O.sections)}</div>
      <div class="ob-section"><div class="label">KWEST trip</div>${pickRow("kwest", O.kwest)}</div>`;
    if (step === 3) return `
      <div class="ob-section"><div class="label">Clubs</div>${pickRow("clubs", O.clubs, true)}</div>
      <div class="ob-section"><div class="label">Hobbies</div>${pickRow("hobbies", O.hobbies, true)}</div>`;
    if (step === 4) return `
      <div class="ob-section"><div class="label">${draft.openTo.length ? draft.openTo.length + " of " + MAX_TOPICS + " picked" : "Optional · none picked"}</div>${pickRow("openTo", suggestedTopics(), true, MAX_TOPICS)}</div>
      <div class="ob-section" style="display:flex;gap:8px">
        <label for="f-topic" style="position:absolute;left:-9999px">Add your own topic</label>
        <input class="field" id="f-topic" placeholder="Add your own, e.g. Chicago food spots" ${draft.openTo.length >= MAX_TOPICS ? "disabled" : ""}>
        <button class="btn primary small" id="add-topic" ${draft.openTo.length >= MAX_TOPICS ? "disabled" : ""}>Add</button></div>`;
    if (step === 5) {
      const me = Object.assign({}, draft, { initials: (draft.first[0] || "") + (draft.last[0] || ""), id: "preview" });
      return `<div class="card" style="margin:16px 20px 0;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
          ${avatar(me, 96, { serif: true, fontSize: 32 })}
          <div class="status-pill">Not met yet</div>
          <h2 style="font-size:24px">${esc(draft.first)} ${esc(draft.last)}</h2>
          <div style="font-size:14px;color:var(--muted)">${esc(KC.metaLine(draft))}</div>
          <div class="wrap" style="justify-content:center;margin-top:6px">${draft.openTo.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>
          ${draft.clubs.length ? `<div style="font-size:13px;color:var(--muted);margin-top:6px">${esc(draft.clubs.join(" · "))}</div>` : ""}
          ${isEmpty(draft) ? `<div style="font-size:13px;color:var(--muted);margin-top:6px">You can add details anytime from My profile.</div>` : ""}
        </div>`;
    }
    return "";
  }

  // Only your name is required; every pick is optional.
  function stepValid(step) {
    if (step === 1) return draft.first.trim() && draft.last.trim();
    return true;
  }
  const isEmpty = (d) => !d.program && !d.career && !d.section && !d.kwest && !d.clubs.length && !d.hobbies.length && !d.openTo.length;
  function stepPicked(step) {
    if (step === 2) return draft.section || draft.kwest;
    if (step === 3) return draft.clubs.length || draft.hobbies.length;
    if (step === 4) return draft.openTo.length;
    return true;
  }

  // ---------- Onboarding / edit profile ----------
  KC.screen("onboard", {
    tab: null,
    render(params, el) {
      const step = params.step || 0, editing = !!params.edit;
      if (!draft || params.fresh) {
        const base = editing ? D.ME : { first: D.DEFAULT_ME.first, last: D.DEFAULT_ME.last, program: "", career: "", section: "", kwest: "", clubs: [], hobbies: [], openTo: [] };
        draft = JSON.parse(JSON.stringify({ first: base.first, last: base.last, program: base.program, career: base.career, section: base.section, kwest: base.kwest, clubs: base.clubs, hobbies: base.hobbies, openTo: base.openTo }));
      }

      if (step === 0) {
        el.innerHTML = `
          <div style="flex-grow:1;display:flex;flex-direction:column;justify-content:center;padding:0 28px;gap:14px">
            <div style="position:relative;width:120px;height:120px;margin-bottom:8px">
              <div class="bubble" style="width:120px;height:120px;position:absolute"><div class="n" style="font-size:34px">520</div></div></div>
            <h1 style="font-size:36px;line-height:1.1">Meet your class, one real conversation at a time.</h1>
            <div class="sub" style="font-size:15px">Kompass helps you find classmates you have things in common with, then reminds you to follow up after you meet.</div>
            <div class="banner info" style="margin:6px 0 0">Signed in as <strong>${esc(D.DEFAULT_ME.first.toLowerCase())}@kellogg.northwestern.edu</strong></div>
          </div>
          <div style="padding:16px 20px 28px;display:flex;flex-direction:column;gap:6px">
            <button class="btn primary" id="start">Build my profile · 1 min</button>
            <button class="linkbtn" id="skip">Skip · use demo profile</button>
          </div>`;
        el.querySelector("#start").addEventListener("click", () => KC.go("onboard", { step: 1, fresh: true }, { replace: true }));
        el.querySelector("#skip").addEventListener("click", () => { S.setProfile(null); draft = null; KC.tab("explore"); });
        return;
      }

      const s = STEPS[step - 1], last = step === STEPS.length;
      el.innerHTML = `
        ${step > 1 || editing ? `<button class="back" id="back">‹ ${step > 1 ? "Back" : "Cancel"}</button>` : ""}
        <div class="head" style="padding-bottom:8px">
          <div class="caps" style="margin-bottom:10px">${editing ? "EDIT PROFILE" : "STEP " + step + " OF " + STEPS.length}</div>
          <h1 class="title" style="font-size:28px">${esc(s.title)}</h1><div class="sub">${esc(s.sub)}</div></div>
        <div class="steps" aria-hidden="true">${STEPS.map((_, i) => `<i class="${i < step ? "on" : ""}"></i>`).join("")}</div>
        <div class="grow" style="padding-bottom:16px">${stepBody(step)}</div>
        <div class="sticky-bottom" style="padding:12px 20px 24px"><button class="btn primary" style="width:100%" id="next" ${stepValid(step) ? "" : "disabled"}>${last ? (editing ? "Save profile" : "Looks good · start exploring") : stepPicked(step) ? "Continue" : "Skip for now"}</button></div>`;

      const redraw = () => { const y = el.scrollTop; KC.go("onboard", { step, edit: editing }, { replace: true }); document.getElementById("screen").scrollTop = y; };
      const next = el.querySelector("#next");
      const syncNext = () => { next.disabled = !stepValid(step); };

      el.querySelectorAll("[data-field]").forEach((b) => b.addEventListener("click", () => {
        const f = b.dataset.field, v = b.dataset.v;
        if (b.dataset.multi) {
          const arr = draft[f];
          if (arr.includes(v)) arr.splice(arr.indexOf(v), 1);
          else if (!b.dataset.max || arr.length < +b.dataset.max) arr.push(v);
        } else draft[f] = draft[f] === v ? "" : v; // tap again to clear
        redraw();
      }));
      ["first", "last"].forEach((k) => { const i = el.querySelector("#f-" + k); if (i) i.addEventListener("input", () => { draft[k] = i.value; syncNext(); }); });
      const addTopic = el.querySelector("#add-topic");
      if (addTopic) {
        const input = el.querySelector("#f-topic");
        const add = () => { const v = input.value.trim(); if (v && draft.openTo.length < MAX_TOPICS && !draft.openTo.includes(v)) { draft.openTo.push(v.charAt(0).toUpperCase() + v.slice(1)); redraw(); } };
        addTopic.addEventListener("click", add);
        input.addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });
      }
      const back = el.querySelector("#back");
      if (back) back.addEventListener("click", () => (step > 1 ? KC.go("onboard", { step: step - 1, edit: editing }, { replace: true }) : KC.back()));
      next.addEventListener("click", () => {
        if (!last) return KC.go("onboard", { step: step + 1, edit: editing }, { replace: true });
        S.setProfile(Object.assign({}, draft, { first: draft.first.trim(), last: draft.last.trim() }));
        draft = null;
        if (editing) { KC.back(); KC.toast("Profile saved"); }
        else { KC.tab("explore"); KC.toast(`Welcome, ${esc(D.ME.first)}! Add a filter to find your people.`, 3000); }
      });
    },
  });

  // ---------- Google Calendar (faked OAuth) ----------
  KC.connectCalendar = function (onDone) {
    KC.sheet("Connect Google Calendar", `
      <div class="oauth">
        <div class="apps"><div class="app" style="background:var(--purple)">KC</div>
          <svg width="28" height="16" viewBox="0 0 28 16" fill="none" stroke="#8A849A" stroke-width="2" stroke-linecap="round"><path d="M2 5h22M20 1l4 4-4 4M26 11H4M8 7l-4 4 4 4"/></svg>
          <div class="app" style="background:#3A6EA5"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></div></div>
        <div style="font-weight:700;font-size:16px">Kompass wants to:</div>
        <ul><li>See when you're <strong>free or busy</strong></li><li>Add coffee chats you schedule to your calendar</li></ul>
        <div style="font-size:12px;color:var(--muted);margin-bottom:16px">Classmates only ever see “free” or “busy”, never your event names.</div>
        <div style="display:flex;gap:10px"><button class="btn ghost" style="flex-grow:1" data-no>Cancel</button><button class="btn primary" style="flex-grow:1" data-yes>Allow</button></div>
      </div>`, (b, close) => {
      b.querySelector("[data-no]").addEventListener("click", close);
      b.querySelector("[data-yes]").addEventListener("click", () => {
        b.querySelector("[data-yes]").textContent = "Connecting…";
        setTimeout(() => { close(); S.state.calendar = true; S.save(); KC.toast("Google Calendar connected"); if (onDone) onDone(); }, 700);
      });
    });
  };

  // ---------- My profile ----------
  KC.screen("myprofile", {
    tab: null,
    render(_, el) {
      const me = D.ME;
      const blocked = S.state.blocked.map((id) => D.byId[id]);
      const open = S.state.reports.filter((r) => r.status === "open").length;
      el.innerHTML = `
        <button class="back" id="back">‹ Back</button>
        <div style="padding:8px 20px 0;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
          ${avatar(me, 96, { serif: true, fontSize: 32, forceColor: true })}
          <h1 style="font-size:28px;margin-top:4px">${esc(me.name)}</h1>
          <div style="font-size:14px;color:var(--muted)">${esc(KC.metaLine(me))}</div>
          <div class="wrap" style="justify-content:center;margin-top:4px">${(me.openTo || []).map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>
        </div>
        <div class="pad" style="padding-top:16px;display:flex;flex-direction:column;gap:16px">
          <button class="btn outline" id="edit">Edit profile</button>
          <div class="card info"><div class="label" style="margin:0">Clubs</div><div class="v">${me.clubs.length ? esc(me.clubs.join(" · ")) : `<span style="color:var(--muted)">None added</span>`}</div></div>
          <div class="card info"><div class="label" style="margin:0">Hobbies</div><div class="v">${me.hobbies.length ? esc(me.hobbies.join(" · ")) : `<span style="color:var(--muted)">None added</span>`}</div></div>
          <div><div class="label">Settings</div>
            <div class="card" style="overflow:hidden">
              <button class="set-row" id="cal"><span>Google Calendar</span><span class="ct">${S.state.calendar ? "Connected · Disconnect" : "Connect ›"}</span></button>
              <button class="set-row" id="blocked"><span>Blocked people</span><span class="ct">${blocked.length} ›</span></button>
              <button class="set-row" id="safety"><span>Safety team view <span class="ct">(demo)</span></span><span class="ct">${open ? open + " open ›" : "›"}</span></button>
              <button class="set-row" id="reset" style="color:#B3261E"><span>Reset demo</span><span class="ct">›</span></button>
            </div></div>
        </div><div style="height:28px"></div>`;
      el.querySelector("#back").addEventListener("click", KC.back);
      el.querySelector("#edit").addEventListener("click", () => KC.go("onboard", { step: 1, edit: true, fresh: true }));
      el.querySelector("#cal").addEventListener("click", () => {
        if (S.state.calendar) KC.confirm("Disconnect Google Calendar?", "Suggested times will stop showing in chats.", "Disconnect", () => { S.state.calendar = false; S.save(); KC.refresh(); });
        else KC.connectCalendar(KC.refresh);
      });
      el.querySelector("#blocked").addEventListener("click", () => {
        KC.sheet("Blocked people", blocked.length ? blocked.map((p) =>
          `<div class="sheet-row" style="gap:12px;min-height:60px">${avatar(p, 40)}<span style="flex-grow:1">${esc(p.name)}</span><button class="btn ghost small" data-unblock="${p.id}">Unblock</button></div>`).join("")
          : `<div class="empty" style="padding:24px">No one. Use the ••• menu on a profile or chat to block someone.</div>`,
          (b, close) => b.querySelectorAll("[data-unblock]").forEach((x) => x.addEventListener("click", () => { S.unblock(x.dataset.unblock); close(); KC.refresh(); KC.toast("Unblocked"); })));
      });
      el.querySelector("#safety").addEventListener("click", () => KC.go("safety"));
      el.querySelector("#reset").addEventListener("click", KC.resetDemo);
    },
  });
})();

</script>

/* safety.js */
// safety.js: the "..." menu on people (remove, delete chat, report, block)
// and a demo view of what Kellogg's safety team sees.

(function () {
  const { D, S, esc, avatar } = window.KC;
  const REASONS = [
    "Harassment or bullying",
    "Inappropriate or sexual messages",
    "Hate speech or discrimination",
    "Pretending to be someone else",
    "Spam or selling something",
    "Something else",
  ];

  // Where to go after someone disappears from the current screen.
  const leave = (from) => (from === "chat" ? KC.tab("chats") : KC.back());

  // The "..." menu. `from` is "chat" or "profile" so we know what to re-render.
  KC.personMenu = function (id, from) {
    const p = D.byId[id], m = S.state.met[id], hasThread = !!S.state.threads[id];
    const items = [];
    if (m && m.status === "keep") items.push({
      label: "Remove from Keep in touch", sub: `${p.first} stays in your network. No more follow-up reminders.`,
      onClick: () => KC.confirm(`Remove ${p.first}?`,
        `${esc(p.first)} moves to <strong>Nice to meet</strong> and this chat is deleted. They won't be notified.`,
        "Remove", () => { S.removeKeep(id); KC.toast(`${esc(p.first)} moved to Nice to meet`); from === "chat" ? KC.tab("chats") : KC.refresh(); }, true),
    });
    if (hasThread) items.push({
      label: "Delete chat", sub: "Clears messages and the draft on your phone only.",
      onClick: () => KC.confirm("Delete this chat?", `Your messages with ${esc(p.first)} will be removed from this phone.`,
        "Delete", () => { S.deleteThread(id); KC.toast("Chat deleted"); from === "chat" ? KC.tab("chats") : KC.refresh(); }, true),
    });
    items.push({ label: `Report ${p.first}`, sub: "Anonymous. Goes to Kellogg's safety team.", danger: true, onClick: () => KC.reportFlow(id, from) });
    if (S.isBlocked(id)) items.push({ label: `Unblock ${p.first}`, onClick: () => { S.unblock(id); KC.toast(`${esc(p.first)} unblocked`); KC.refresh(); } });
    else items.push({
      label: `Block ${p.first}`, sub: "They disappear from your app and can't message you.", danger: true,
      onClick: () => KC.confirm(`Block ${p.first}?`,
        `${esc(p.first)} won't be able to message you or see that you're going to events. They won't be told you blocked them.`,
        "Block", () => { S.block(id); KC.toast(`${esc(p.first)} blocked`); leave(from); }, true),
    });
    KC.menu(p.name, items);
  };

  // Report: pick a reason, add details, optionally block.
  KC.reportFlow = function (id, from) {
    const p = D.byId[id];
    let reason = null;
    KC.sheet(`Report ${p.first}`, `
      <div style="font-size:13px;color:var(--muted);margin-bottom:6px">${esc(p.first)} won't know who reported them. Kellogg's safety team reviews every report and can restrict the account.</div>
      <div id="reasons">${REASONS.map((r, i) => `<button class="radio-row" data-r="${i}" role="radio" aria-checked="false"><span class="rb"></span>${esc(r)}</button>`).join("")}</div>
      <label for="rep-details" class="label" style="display:block;margin:16px 0 6px">What happened? (optional)</label>
      <textarea id="rep-details" class="field" placeholder="Add anything that helps the team understand"></textarea>
      <label class="check"><input type="checkbox" id="rep-block" checked> Also block ${esc(p.first)}</label>
      <button class="btn danger" style="width:100%" id="rep-send" disabled>Send report</button>`,
      (body, close) => {
        const send = body.querySelector("#rep-send");
        body.querySelectorAll("[data-r]").forEach((b) => b.addEventListener("click", () => {
          body.querySelectorAll("[data-r]").forEach((x) => { x.classList.remove("on"); x.setAttribute("aria-checked", "false"); });
          b.classList.add("on"); b.setAttribute("aria-checked", "true");
          reason = REASONS[+b.dataset.r]; send.disabled = false;
        }));
        send.addEventListener("click", () => {
          S.report(id, reason, body.querySelector("#rep-details").value.trim());
          const blocked = body.querySelector("#rep-block").checked;
          if (blocked) S.block(id);
          close();
          KC.toast(`Report sent. Kellogg's safety team will review it${blocked ? ` and ${esc(p.first)} is blocked` : ""}.`, 3200);
          if (blocked) leave(from); else KC.refresh();
        });
      });
  };

  // ---------- Safety team (demo of the admin side) ----------
  KC.screen("safety", {
    tab: null,
    render(_, el) {
      const reports = S.state.reports.slice().reverse();
      const badge = (st) => st === "open" ? `<span class="status-pill" style="background:#FFF4D6;color:#8A5A00">Needs review</span>`
        : st === "restricted" ? `<span class="status-pill" style="background:#FDECEA;color:#8C1D18">Restricted</span>`
        : `<span class="status-pill">Dismissed</span>`;
      el.innerHTML = `
        <button class="back" id="back">‹ Back</button>
        <div class="head"><h1 class="title">Safety team</h1>
          <div class="sub">Demo of what Kellogg's safety team sees. Reporters stay anonymous to the person reported.</div></div>
        <div class="pad" style="display:flex;flex-direction:column;gap:12px;padding-bottom:24px">
          ${reports.length ? reports.map((r) => {
            const p = D.byId[r.id], idx = S.state.reports.indexOf(r);
            const count = S.state.reports.filter((x) => x.id === r.id).length;
            return `<div class="card" style="padding:14px">
              <div style="display:flex;gap:12px;align-items:center">${avatar(p, 44, { forceColor: true })}
                <div style="flex-grow:1"><div style="font-weight:700">${esc(p.name)}</div>
                <div style="font-size:12px;color:var(--muted)">${count} report${count > 1 ? "s" : ""} · ${new Date(r.at).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" })}</div></div>
                ${badge(r.status)}</div>
              <div style="margin-top:10px;font-size:14px"><strong>${esc(r.reason)}</strong>${r.details ? `<div style="color:var(--ink-2);margin-top:4px">“${esc(r.details)}”</div>` : ""}</div>
              ${r.status === "open" ? `<div style="display:flex;gap:8px;margin-top:12px">
                <button class="btn ghost small" style="flex-grow:1" data-dismiss="${idx}">Dismiss</button>
                <button class="btn danger small" style="flex-grow:1" data-restrict="${idx}">Restrict account</button></div>`
              : r.status === "restricted" ? `<div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)">Hidden from the class, can't message anyone.<button class="linkbtn" style="font-size:13px" data-lift="${idx}">Lift</button></div>` : ""}
            </div>`;
          }).join("") : `<div class="empty"><h2>No reports</h2>When someone uses <strong>Report</strong> from a profile or chat, it shows up here.</div>`}
        </div>`;
      el.querySelector("#back").addEventListener("click", KC.back);
      el.querySelectorAll("[data-restrict]").forEach((b) => b.addEventListener("click", () => {
        const r = S.state.reports[+b.dataset.restrict];
        S.state.reports.forEach((x) => { if (x.id === r.id && x.status === "open") x.status = "restricted"; });
        if (!S.state.restricted.includes(r.id)) S.state.restricted.push(r.id);
        S.save(); KC.toast(`${esc(D.byId[r.id].first)}'s account is restricted`); KC.refresh();
      }));
      el.querySelectorAll("[data-dismiss]").forEach((b) => b.addEventListener("click", () => {
        S.state.reports[+b.dataset.dismiss].status = "dismissed"; S.save(); KC.refresh();
      }));
      el.querySelectorAll("[data-lift]").forEach((b) => b.addEventListener("click", () => {
        const r = S.state.reports[+b.dataset.lift];
        S.state.restricted = S.state.restricted.filter((x) => x !== r.id);
        S.state.reports.forEach((x) => { if (x.id === r.id && x.status === "restricted") x.status = "dismissed"; });
        S.save(); KC.refresh();
      }));
    },
  });
})();

</script>
  <script>
/* agent.js */
// agent.js: the follow-up agent.
// It watches your Keep in touch group, finds anyone you haven't talked to in
// `thresholdDays`, and queues a drafted message for you to approve. It never sends on its own.
//
// Engine: Claude (claude-opus-5) with three client-side tools, run in a small agent loop.
// Backup: if there's no API key, no internet, or the call fails, a built-in planner runs the
// same tools and writes template messages, so the demo never breaks.

(function () {
  const { D, S, esc, avatar } = window.KC;
  const KEY_STORE = "kellogg-connect-claude-key"; // kept outside app state so "Reset demo" doesn't wipe it
  const MODEL = "claude-opus-5";
  const MAX_PER_RUN = 3;
  const MAX_TURNS = 10;
  const DRAFT_VERSION = 2; // bump when the drafting rules change; older waiting drafts get rewritten
  const A = () => S.state.agent;

  const getKey = () => { try { return localStorage.getItem(KEY_STORE) || ""; } catch (e) { return ""; } };
  const setKey = (k) => { try { k ? localStorage.setItem(KEY_STORE, k) : localStorage.removeItem(KEY_STORE); } catch (e) { /* ignore */ } };
  const fmtDate = (t) => new Date(t).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });

  let running = false;
  const listeners = new Set(); // screens that want live log updates

  function log(text, kind) {
    A().log.push({ at: S.now(), text, kind: kind || "step" });
    if (A().log.length > 80) A().log.splice(0, A().log.length - 80);
    S.save();
    [...listeners].forEach((fn) => fn());
  }

  // ---------- Tools (shared by Claude and the backup planner) ----------
  function listKeepInTouch() {
    const now = S.now();
    return Object.keys(S.state.met)
      .filter((id) => S.state.met[id].status === "keep" && S.visible(id))
      .map((id) => {
        const p = D.byId[id], snoozedUntil = A().snoozed[id];
        return {
          id, name: p.name, days_since_last_contact: S.daysSince(id), met: S.state.met[id].at,
          snoozed: !!(snoozedUntil && snoozedUntil > now),
          already_queued: A().queue.some((q) => q.id === id),
        };
      })
      .sort((a, b) => (b.days_since_last_contact || 0) - (a.days_since_last_contact || 0));
  }

  function personContext(id) {
    const p = D.byId[id];
    if (!p || !S.state.met[id]) return { error: "Not someone you've met." };
    const t = S.state.threads[id];
    // Only events still ahead on the (demo) clock count as a reason to reach out.
    const upcoming = D.EVENTS.filter((e) => !S.state.ended.includes(e.id) && new Date(e.date).getTime() > S.now() && e.attendees.includes(id))
      .map((e) => ({ event: e.title, date: fmtDate(new Date(e.date)), you_are_going: S.state.going.includes(e.id) }));
    const lastMsg = t && t.messages[t.messages.length - 1];
    const me = D.ME;
    return {
      name: p.name, first_name: p.first, program: p.program, section: p.section, kwest: p.kwest,
      previous_job: p.prev, career_interest: p.career,
      open_to_chat_about: p.openTo, clubs: p.clubs, hobbies: p.hobbies,
      how_you_met: S.state.met[id].at,
      days_since_last_contact: S.daysSince(id),
      your_private_note: S.state.notes[id] || null,
      last_conversation: t ? t.messages.slice(-6).map((m) => ({ from: m.from === "me" ? "you" : p.first, text: m.text })) : [],
      last_conversation_days_ago: lastMsg && lastMsg.at ? Math.floor((S.now() - lastMsg.at) / S.DAY) : null,
      upcoming_events_they_are_attending: upcoming,
      shared_clubs: p.clubs.filter((c) => (me.clubs || []).includes(c)),
      shared_hobbies: p.hobbies.filter((h) => (me.hobbies || []).includes(h)),
    };
  }

  function queueFollowUp({ person_id, message, reason }, source) {
    const p = D.byId[person_id];
    if (!p || !S.state.met[person_id] || S.state.met[person_id].status !== "keep") return { error: "Only people in Keep in touch can be queued." };
    if (A().queue.some((q) => q.id === person_id)) return { error: "Already waiting for approval." };
    if (A().queue.filter((q) => q.runAt === A().runAt).length >= MAX_PER_RUN) return { error: `Limit of ${MAX_PER_RUN} per run reached.` };
    A().queue.push({ v: DRAFT_VERSION, id: person_id, message: String(message).trim(), reason: String(reason || "").trim(), days: S.daysSince(person_id), source, at: S.now(), runAt: A().runAt });
    S.save();
    log(`Drafted a follow-up for ${p.first}. Waiting for your OK.`, "queue");
    return { ok: true, queued_for_user_approval: true };
  }

  const TOOLS = [
    {
      name: "list_keep_in_touch",
      description: "List everyone in the user's Keep in touch group with days since they last talked, whether they're snoozed, and whether a follow-up is already waiting for approval. Call this first.",
      input_schema: { type: "object", properties: {}, required: [], additionalProperties: false },
    },
    {
      name: "get_person_context",
      description: "Get what you need to write a personal follow-up to one classmate: profile, topics they're open to, how you met, the user's private note, recent messages, upcoming events they're attending, and what the user has in common with them.",
      input_schema: { type: "object", properties: { person_id: { type: "string", description: "id from list_keep_in_touch" } }, required: ["person_id"], additionalProperties: false },
    },
    {
      name: "queue_follow_up",
      description: "Put a drafted follow-up message in front of the user for approval. This does NOT send anything; the user decides.",
      input_schema: {
        type: "object",
        properties: {
          person_id: { type: "string" },
          message: { type: "string", description: "The message, written as the user, 1-3 sentences." },
          reason: { type: "string", description: "One short line shown to the user explaining why now, e.g. 'You're both going to Trivia Night Thursday'." },
        },
        required: ["person_id", "message", "reason"],
        additionalProperties: false,
      },
      strict: true,
    },
  ];

  function runTool(name, input, source) {
    if (name === "list_keep_in_touch") {
      const people = listKeepInTouch();
      log(`Checked ${people.length} people in Keep in touch.`);
      return people;
    }
    if (name === "get_person_context") {
      const p = D.byId[input.person_id];
      const t = S.state.threads[input.person_id];
      log(t && t.messages.length
        ? `Reading your last conversation with ${p.first} (${S.daysSince(input.person_id)} days ago)…`
        : `Reading context for ${p ? p.first : "someone"}: last talked ${S.daysSince(input.person_id)} days ago.`);
      return personContext(input.person_id);
    }
    if (name === "queue_follow_up") return queueFollowUp(input, source);
    return { error: "Unknown tool" };
  }

  // ---------- Claude engine ----------
  function systemPrompt() {
    return `You are the follow-up agent inside Kompass, an app that helps Kellogg MBA students stay in touch with classmates they've met.

Today is ${fmtDate(S.now())}. The user is ${D.ME.name}.

Your job on each run: find classmates in the user's Keep in touch group they haven't talked to in at least ${A().thresholdDays} days, and queue a short follow-up message for the user to approve. You never send anything yourself; queue_follow_up only puts a draft in front of the user.

How to work:
- Start with list_keep_in_touch. Skip anyone under ${A().thresholdDays} days, snoozed, or already queued.
- Queue at most ${MAX_PER_RUN} people this run. Prioritize the longest gaps, and anyone with an upcoming event in common (that's a natural reason to reach out).
- Call get_person_context before writing to each person, and read last_conversation closely.
- If you two made a plan that never happened (e.g. "let's meet up after trivia night" and then silence), that's the best reason to reach out: bring it up naturally, admit it slipped, and ask if they still want to. Put people with an unfinished plan first.
- Write as the user, the way a friend texts a friend: casual, warm, short (1-2 sentences). It must NOT sound like networking. Never say things like "connect", "network", "pick your brain", "touch base", "would love to learn more about your experience", or "coffee chat".
- Pick exactly ONE reason to reach out and stick to it:
  - social: a plan you two made, an event they're going to, a shared hobby. Suggest hanging out, lunch, or going to the event together.
  - OR the topic you talked about (e.g. recruiting). Suggest studying or prepping together.
  Never mix the two in one message. Inviting someone to a party and then bringing up recruiting reads like you're using them.
- Examples of the right tone:
  "Hey Diego! We were planning to meet up after trivia night and it looks like we haven't caught up yet. Would love to plan something if you're free!"
  "Hey Hana! I know we were talking about PM recruiting. Would still love to meet up and maybe study together sometime!"
- Use the private note to pick a topic, but don't quote it or reveal that notes exist.
- The reason line is for the user, not the classmate: short and factual.
- If nobody is due, don't queue anything. Finish with a one-sentence summary of what you did.`;
  }

  async function loadSdk() {
    // Plain browser app, no bundler: load the official SDK as an ES module from the CDN.
    const mod = await import("https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk/+esm");
    return mod.default || mod.Anthropic;
  }

  async function runWithClaude(apiKey) {
    const Anthropic = await loadSdk();
    const client = new Anthropic({ apiKey, dangerouslyAllowBrowser: true });
    const messages = [{ role: "user", content: `Run your daily follow-up check for ${D.ME.first}.` }];
    let useFallbacks = true;

    const call = async () => {
      const params = { model: MODEL, max_tokens: 16000, system: systemPrompt(), tools: TOOLS, messages, output_config: { effort: "low" } };
      if (!useFallbacks) return client.messages.create(params);
      try {
        // If Claude declines a request, the API re-runs it on Anthropic's recommended fallback model.
        return await client.beta.messages.create({ ...params, betas: ["server-side-fallback-2026-07-01"], fallbacks: "default" });
      } catch (err) {
        if (err && err.status === 400) { useFallbacks = false; return client.messages.create(params); }
        throw err;
      }
    };

    for (let turn = 0; turn < MAX_TURNS; turn++) {
      const res = await call();
      if (res.stop_reason === "refusal") throw new Error("Claude declined this request");
      const toolUses = res.content.filter((b) => b.type === "tool_use");
      messages.push({ role: "assistant", content: res.content });
      if (res.stop_reason === "pause_turn") continue;
      if (!toolUses.length || res.stop_reason === "end_turn") {
        const text = res.content.filter((b) => b.type === "text").map((b) => b.text).join(" ").trim();
        if (text) log(text, "summary");
        return;
      }
      if (res.stop_reason === "max_tokens") throw new Error("Response was cut off");
      const results = toolUses.map((tu) => {
        let out;
        try { out = runTool(tu.name, tu.input || {}, "claude"); } catch (e) { return { type: "tool_result", tool_use_id: tu.id, content: String(e.message || e), is_error: true }; }
        return { type: "tool_result", tool_use_id: tu.id, content: JSON.stringify(out), is_error: !!(out && out.error) };
      });
      messages.push({ role: "user", content: results });
    }
    log("Stopped after the maximum number of steps.", "warn");
  }

  // ---------- Backup planner (no key / offline) ----------
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  // Find a plan in the last conversation that nobody followed up on, e.g. "Let's meet up after trivia night".
  function openPlan(ctx) {
    for (const m of ctx.last_conversation.slice().reverse()) {
      const hit = m.text.match(/\b(?:let'?s|we should|want to)\s+([^.!?]+)/i);
      if (hit) return hit[1].replace(/\s+(?:and\s+)?(?:grab|get)\s+a\s+drink$/i, "").trim();
    }
    return null;
  }
  // Built-in drafts. Tone: a friend texting a friend, not networking. Short, casual, no "pick your brain".
  function templateMessage(ctx) {
    const hi = `Hey ${ctx.first_name}!`;
    const plan = openPlan(ctx);
    if (plan) return {
      message: `${hi} We were planning to ${plan} and it looks like we haven't caught up yet. Would love to plan something if you're free!`,
      reason: `You planned to ${plan} ${ctx.last_conversation_days_ago} days ago, then it went quiet.`,
    };
    const ev = ctx.upcoming_events_they_are_attending[0];
    if (ev) return {
      message: `${hi} Are you going to the ${ev.event}? Would be fun to go together. It's been way too long!`,
      reason: `${ctx.first_name} is going to ${ev.event} (${ev.date}).`,
    };
    const topic = ctx.open_to_chat_about[0] && D.lcFirst(ctx.open_to_chat_about[0]);
    if (topic) {
      const studyish = /recruit|case prep|interview|\bIB\b|\bPM\b/i.test(topic);
      return {
        message: `${hi} I know we were talking about ${topic}. ${studyish ? "Would still love to meet up and maybe study or prep together sometime!" : "Would still love to grab lunch or hang out sometime!"}`,
        reason: `You two talked about ${topic}.`,
      };
    }
    const hobby = ctx.shared_hobbies[0];
    if (hobby) return { message: `${hi} Feels like forever. Still down for some ${hobby.toLowerCase()} sometime?`, reason: `You both like ${hobby.toLowerCase()}.` };
    return { message: `${hi} Feels like we haven't caught up in forever. Would love to hang out if you're free this week!`, reason: `It's been ${ctx.days_since_last_contact} days.` };
  }
  async function runWithTemplates() {
    const people = runTool("list_keep_in_touch", {}, "template"); await wait(450);
    const hasPlan = (id) => !!openPlan(personContext(id));
    const due = people.filter((p) => p.days_since_last_contact >= A().thresholdDays && !p.snoozed && !p.already_queued)
      .sort((a, b) => hasPlan(b.id) - hasPlan(a.id)).slice(0, MAX_PER_RUN);
    if (!due.length) { log(`Nobody's past ${A().thresholdDays} days. All caught up.`, "summary"); return; }
    for (const p of due) {
      const ctx = runTool("get_person_context", { person_id: p.id }, "template"); await wait(450);
      queueFollowUp({ person_id: p.id, ...templateMessage(ctx) }, "template"); await wait(300);
    }
    const skipped = people.filter((p) => p.days_since_last_contact >= A().thresholdDays).length - due.length;
    log(`Queued ${due.length} follow-up${due.length > 1 ? "s" : ""}${skipped > 0 ? `, holding ${skipped} more for next time so you're not flooded` : ""}.`, "summary");
  }

  // Drafts written under older rules (e.g. mixing social + recruiting) are dropped, and the
  // agent re-drafts them on its next check.
  (function dropStaleDrafts() {
    const before = A().queue.length;
    A().queue = A().queue.filter((q) => q.v === DRAFT_VERSION);
    if (A().queue.length < before) { A().lastRun = 0; S.save(); }
  })();

  // ---------- Run ----------
  KC.agentRunning = () => running;
  KC.agentQueueCount = () => A().queue.filter((q) => S.visible(q.id)).length;
  KC.agentOnUpdate = (fn) => { listeners.add(fn); return () => listeners.delete(fn); };

  KC.runAgent = async function (why) {
    if (running || !A().enabled) return;
    running = true; A().runAt = S.now(); A().lastRun = S.now(); S.save();
    log(`${why || "Daily check"} · ${fmtDate(S.now())}`, "start");
    const key = getKey();
    try {
      if (!key) throw Object.assign(new Error("no key"), { quiet: true });
      log("Thinking with Claude…", "engine");
      await runWithClaude(key);
    } catch (err) {
      const why = err && err.status === 401 ? "API key not accepted" : err && err.status ? `error ${err.status}` : navigator.onLine === false ? "offline" : (err && err.message) || "error";
      if (!err.quiet) log(`Claude unavailable (${why}). Using built-in drafts.`, "warn");
      else log("No Claude API key set. Using built-in drafts.", "engine");
      await runWithTemplates();
    } finally {
      running = false; S.save(); [...listeners].forEach((fn) => fn()); KC.refreshTabs();
      if (KC.agentQueueCount()) KC.toast(`Follow-up agent: ${KC.agentQueueCount()} waiting for your OK`);
    }
  };

  // Demo: jump the clock forward and let the agent wake up.
  KC.fastForward = function (days) {
    A().clockOffsetDays = (A().clockOffsetDays || 0) + days;
    S.save();
    KC.toast(`⏩ ${days} days later: it's ${fmtDate(S.now())}`);
    KC.refresh();
    KC.runAgent("Woke up after " + days + " days");
  };

  // Runs on its own once per (demo) day when you open Chats.
  KC.agentMaybeRun = function () {
    if (A().enabled && !running && S.now() - (A().lastRun || 0) > S.DAY) KC.runAgent("Daily check");
  };

  // ---------- Approvals ----------
  function approve(item, text) {
    const p = D.byId[item.id];
    const t = S.state.threads[item.id] || (S.state.threads[item.id] = { slot: null, draft: "", messages: [], created: S.now() });
    t.messages.push({ from: "me", text, meta: "Sent · approved from your follow-up agent", at: S.now() });
    A().queue = A().queue.filter((q) => q !== item);
    S.touch(item.id);
    log(`You approved the message to ${p.first}. Clock reset.`, "done");
    KC.toast(`Sent to ${esc(p.first)}`);
  }
  function drop(item, what) {
    const p = D.byId[item.id];
    A().queue = A().queue.filter((q) => q !== item);
    if (what === "snooze") { A().snoozed[item.id] = S.now() + 7 * S.DAY; log(`Snoozed ${p.first} for a week.`, "done"); KC.toast(`Snoozed ${esc(p.first)} for a week`); }
    if (what === "nice") { S.removeKeep(item.id); log(`Moved ${p.first} to Nice to meet. No more reminders.`, "done"); KC.toast(`${esc(p.first)} moved to Nice to meet`); }
    S.save();
  }

  // Rendered at the top of Chats.
  KC.agentPanel = function () {
    const q = A().queue.filter((x) => S.visible(x.id));
    const lastLines = A().log.slice(-3);
    const watching = listKeepInTouch().length;
    return `
      <div class="agent-card">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="agent-ic ${running ? "live" : ""}">✦</div>
          <div style="flex-grow:1;min-width:0">
            <div style="font-weight:700;font-size:15px">Follow-up agent</div>
            <div style="font-size:12px;color:var(--muted)">${A().enabled ? `Watching ${watching} people · nudges after ${A().thresholdDays} days · ${getKey() ? "Claude" : "built-in drafts"}` : "Paused"}</div>
          </div>
          <button class="tool" data-agent="settings" aria-label="Agent settings">Settings</button>
        </div>
        <div class="agent-log" aria-live="polite">${running ? `<div class="spin-sm"></div>` : ""}${lastLines.map((l) => `<div class="${l.kind}">${esc(l.text)}</div>`).join("") || `<div>Checks your Keep in touch group every day.</div>`}</div>
        <div class="agent-btns">
          <button class="btn ghost small" data-agent="run" ${running ? "disabled" : ""}>Run now</button>
          <button class="btn ghost small" data-agent="ff" ${running ? "disabled" : ""} title="Demo: jump ahead 2 weeks">⏩ 2 weeks</button>
          <button class="btn ghost small" data-agent="log">Activity</button>
        </div>
      </div>
      ${q.length ? `<div class="pad caps" style="padding-top:14px">NEEDS YOUR OK · ${q.length}</div>
        <div class="pad" style="display:flex;flex-direction:column;gap:10px;padding-top:8px">${q.map((item, i) => {
          const p = D.byId[item.id];
          return `<div class="card approve" data-q="${i}">
            <div style="display:flex;gap:10px;align-items:center">${avatar(p, 40)}
              <div style="flex-grow:1"><div style="font-weight:700">${esc(p.name)}</div>
              <div style="font-size:12px;color:var(--pink-ink);font-weight:700">${S.daysSince(item.id)} days since you talked</div></div>
              <span class="src">${item.source === "claude" ? "✦ Claude" : "Draft"}</span></div>
            ${item.reason ? `<div style="font-size:13px;color:var(--ink-2);margin-top:8px">Why now: ${esc(item.reason)}</div>` : ""}
            <label class="caps" style="display:block;margin-top:10px" for="qmsg-${i}">MESSAGE · EDIT ANYTHING</label>
            <textarea id="qmsg-${i}" class="field" style="height:120px;margin-top:4px;line-height:1.4">${esc(item.message)}</textarea>
            <div style="display:flex;gap:6px;margin-top:10px">
              <button class="btn primary small" style="flex-grow:1" data-act="send">Send</button>
              <button class="btn ghost small" data-act="snooze">Snooze 1 wk</button>
              <button class="btn ghost small" data-act="nice" title="Move to Nice to meet">Not anymore</button>
            </div></div>`;
        }).join("")}</div>` : ""}`;
  };

  KC.wireAgentPanel = function (el) {
    const q = A().queue.filter((x) => S.visible(x.id));
    el.querySelectorAll("[data-agent]").forEach((b) => b.addEventListener("click", () => {
      const a = b.dataset.agent;
      if (a === "run") KC.runAgent("Manual check");
      if (a === "ff") KC.fastForward(14);
      if (a === "log") openLog();
      if (a === "settings") KC.agentSettings();
    }));
    el.querySelectorAll("[data-q]").forEach((card) => {
      const item = q[+card.dataset.q], ta = card.querySelector("textarea");
      ta.addEventListener("input", () => { item.message = ta.value; S.save(); });
      card.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => {
        const act = b.dataset.act;
        if (act === "send") { if (!ta.value.trim()) return ta.focus(); approve(item, ta.value.trim()); }
        else drop(item, act);
        KC.refresh();
      }));
    });
    // Live updates while the agent is working.
    const off = KC.agentOnUpdate(() => { if (document.body.contains(el)) KC.refresh(); else off(); });
  };

  function openLog() {
    const entries = A().log.slice().reverse();
    KC.sheet("Agent activity", entries.length ? entries.map((l) =>
      `<div class="log-row ${l.kind}"><span class="ct">${new Date(l.at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}</span><div>${esc(l.text)}</div></div>`).join("")
      : `<div class="empty" style="padding:24px">Nothing yet.</div>`);
  }

  KC.agentSettings = function () {
    const key = getKey();
    KC.sheet("Follow-up agent", `
      <label class="check" style="margin-top:0"><input type="checkbox" id="ag-on" ${A().enabled ? "checked" : ""}> Agent is on</label>
      <div class="label" style="margin-top:8px">Nudge me after</div>
      <div class="wrap" id="ag-days">${[7, 14, 30].map((d) => `<button class="pick ${A().thresholdDays === d ? "on" : ""}" data-d="${d}">${d === 7 ? "1 week" : d === 14 ? "2 weeks" : "1 month"}</button>`).join("")}</div>
      <label class="label" for="ag-key" style="display:block;margin-top:18px">Claude API key</label>
      <input id="ag-key" class="field" type="password" autocomplete="off" placeholder="sk-ant-…" value="${esc(key)}">
      <div style="font-size:12px;color:var(--muted);margin:6px 0 16px">Stored only in this browser (fine for a demo, not for production). Without a key, the agent uses built-in drafts.</div>
      <button class="btn primary" style="width:100%" id="ag-save">Save</button>`,
      (b, close) => {
        let days = A().thresholdDays;
        b.querySelectorAll("[data-d]").forEach((x) => x.addEventListener("click", () => {
          days = +x.dataset.d; b.querySelectorAll("[data-d]").forEach((y) => y.classList.toggle("on", y === x));
        }));
        b.querySelector("#ag-save").addEventListener("click", () => {
          A().enabled = b.querySelector("#ag-on").checked; A().thresholdDays = days;
          setKey(b.querySelector("#ag-key").value.trim()); S.save(); close(); KC.refresh(); KC.toast("Agent settings saved");
        });
      });
  };
})();

</script>
</body>
</html>
