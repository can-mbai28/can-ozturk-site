  <style>
:root {
  --purple: #4E2A84;
  --purple-soft: #EDE7F6;
  --pink: #E4577E;
  --pink-soft: #FBE4EB;
  --pink-ink: #9C2F52;
  --ivory: #F6F3EE;
  --ink: #1D1A2B;
  --ink-2: #3F3B4A;
  --muted: #5E5970;
  --unmet: #CFCBD6;
  --line: #E4DFEA;
  --line-2: #DDD8E4;
  --chip: #E9E5EE;
  --teal: #2F7D6D;
  --serif: "Fraunces", Georgia, serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  overflow: hidden;
  font-family: "DM Sans", system-ui, sans-serif; color: var(--ink);
  background: #E8E4EE; display: flex; align-items: center; justify-content: center;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
h1, h2 { font-family: var(--serif); font-weight: 600; margin: 0; }

/* Phone frame */
.phone {
  width: 390px; height: 844px; background: var(--ivory); border-radius: 44px; overflow: hidden;
  position: relative; display: flex; flex-direction: column;
  box-shadow: 0 0 0 10px #1D1A2B, 0 30px 80px rgba(29,26,43,.35);
  flex-shrink: 0; transform-origin: center;
}
@media (max-width: 440px) {
  body { background: var(--ivory); }
  .phone { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
}
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; position: relative; }
.screen.enter { animation: screenIn .28s ease both; }
@keyframes screenIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* Tab bar */
.tabbar { height: 76px; flex-shrink: 0; border-top: 1px solid var(--line); background: #fff; display: flex; justify-content: space-around; align-items: center; padding-bottom: 8px; }
.tabbar button { border: none; background: none; font-size: 12px; color: var(--muted); min-height: 44px; min-width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
.tabbar svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button.active { color: var(--purple); font-weight: 700; }
.tabbar .dot { position: absolute; top: 2px; right: 16px; width: 8px; height: 8px; border-radius: 50%; background: var(--pink); }

/* Common */
.head { padding: 12px 20px 12px; }
.head.row { display: flex; justify-content: space-between; align-items: center; }
.title { font-size: 30px; }
.sub { font-size: 14px; color: var(--muted); margin-top: 4px; }
.label { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
.caps { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.pad { padding: 0 20px; }
.grow { flex-grow: 1; }
.back { position: absolute; top: 12px; left: 10px; height: 40px; padding: 0 10px; border: none; background: none; font-size: 15px; font-weight: 500; color: var(--purple); z-index: 2; }
.pill-count { padding: 8px 12px; border-radius: 999px; background: var(--purple-soft); color: var(--purple); font-size: 13px; font-weight: 700; border: none; }

.btn { height: 52px; border-radius: 14px; border: none; font-size: 15px; font-weight: 700; padding: 0 18px; transition: transform .1s, background .2s; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--purple); color: #fff; }
.btn.dark { background: var(--ink); color: #fff; }
.btn.outline { background: #fff; border: 1.5px solid var(--purple); color: var(--purple); }
.btn.ghost { background: #fff; border: 1px solid var(--line-2); color: var(--ink); font-weight: 400; }
.btn.small { height: 44px; border-radius: 12px; font-size: 14px; padding: 0 14px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn-row { display: flex; gap: 10px; padding: 16px 20px 28px; }
.btn-row .btn { flex-grow: 1; }

.chip { height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: var(--purple); color: #fff; font-size: 14px; font-weight: 500; }
.chip.add { border: 1.5px dashed #8A849A; background: transparent; color: var(--ink); }
.chip.pop { animation: chipIn .25s ease both; }
@keyframes chipIn { from { transform: scale(.6); opacity: 0; } }
.tag { padding: 8px 12px; border-radius: 999px; background: var(--pink-soft); color: var(--pink-ink); font-size: 13px; font-weight: 500; }
.opt { height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-2); background: #fff; color: var(--ink); font-size: 14px; }
.wrap { display: flex; gap: 8px; flex-wrap: wrap; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 16px; }

/* Avatars: gray until met */
.av { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; background: var(--unmet); color: var(--ink-2); transition: background .6s, color .6s, box-shadow .6s; }
.av.met { color: #fff; }
.av.unlock { animation: unlock .9s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes unlock { 0% { transform: scale(.85); filter: grayscale(1); } 60% { transform: scale(1.12); } 100% { transform: scale(1); filter: none; } }

/* Explore / bubble */
.bubble-zone { flex-grow: 1; display: flex; align-items: center; justify-content: center; position: relative; min-height: 340px; }
.ring { border-radius: 50%; border: 1.5px dashed #D9D2E3; display: flex; align-items: center; justify-content: center; }
.ring.r1 { width: 330px; height: 330px; }
.ring.r2 { width: 260px; height: 260px; border-color: #E7B7C6; }
.bubble {
  border-radius: 50%; background: var(--pink); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: 0 20px 40px rgba(228,87,126,.3); transition: width .6s cubic-bezier(.3,1.4,.5,1), height .6s cubic-bezier(.3,1.4,.5,1); border: none; position: absolute;
}
.bubble .n { font-family: var(--serif); font-size: 48px; font-weight: 600; line-height: 1; }
.bubble .l { font-size: 14px; font-weight: 500; margin-top: 4px; }
.bubble.popping { animation: pop .45s ease-in forwards; }
@keyframes pop { 40% { transform: scale(1.15); } 100% { transform: scale(1.8); opacity: 0; } }
.trail { position: absolute; top: 14px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--muted); }
.see-all { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; }
.linkbtn { border: none; background: none; color: var(--purple); font-weight: 700; font-size: 14px; min-height: 44px; }

/* People cards */
.people { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.pcard { padding: 14px; display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; animation: cardIn .35s ease both; }
@keyframes cardIn { from { opacity: 0; transform: translateY(16px) scale(.96); } }
.pcard .name { font-weight: 700; font-size: 16px; }
.pcard .meta { font-size: 12px; color: var(--muted); }
.pcard .open { font-size: 12px; color: var(--purple); margin-top: 4px; }
.pcard .open.ok { color: var(--teal); font-weight: 700; }
.pcard .body { flex-grow: 1; min-width: 0; cursor: pointer; }
.meet-btn { height: 44px; padding: 0 12px; border-radius: 12px; border: none; background: var(--purple); color: #fff; font-weight: 700; font-size: 13px; flex-shrink: 0; }
.meet-btn.on { background: var(--purple-soft); color: var(--purple); }

/* Bottom sheet */
.sheet-bg { position: absolute; inset: 0; background: rgba(29,26,43,.35); z-index: 20; animation: fade .2s both; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 72%; background: #fff; border-radius: 24px 24px 0 0; z-index: 21; display: flex; flex-direction: column; animation: up .25s ease both; }
@keyframes up { from { transform: translateY(100%); } }
.sheet-head { padding: 18px 20px 8px; display: flex; justify-content: space-between; align-items: center; }
.sheet-head h2 { font-size: 22px; }
.sheet-body { overflow-y: auto; padding: 4px 20px 24px; }
.sheet-row { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 48px; border: none; border-bottom: 1px solid var(--line); background: none; font-size: 15px; text-align: left; padding: 0 2px; }
.sheet-row .ct { color: var(--muted); font-size: 13px; }
.x { border: none; background: var(--chip); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; }

/* Profile */
.status-pill { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--chip); padding: 4px 10px; border-radius: 999px; }
.status-pill.met { background: #DDEFEA; color: var(--teal); }
.info { padding: 12px 14px; border-radius: 14px; }
.info .v { font-size: 14px; margin-top: 4px; }
.locked { color: var(--muted); font-size: 14px; margin-top: 4px; display: flex; gap: 6px; align-items: center; }
textarea.notes { width: 100%; height: 88px; border-radius: 14px; border: 1px solid var(--line-2); background: #fff; padding: 12px; font: inherit; font-size: 14px; color: var(--ink); resize: none; }
.saved { font-size: 12px; color: var(--teal); font-weight: 700; margin-left: 6px; opacity: 0; transition: opacity .3s; }
.saved.show { opacity: 1; }

/* Scan */
.seg { display: flex; gap: 4px; padding: 0 20px; }
.seg button { flex-grow: 1; height: 44px; border-radius: 12px; border: none; background: var(--chip); color: var(--ink); font-size: 14px; font-weight: 500; }
.seg button.on { background: var(--ink); color: #fff; font-weight: 700; }
.qr-box { width: 240px; height: 240px; background: #fff; border-radius: 20px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); position: relative; overflow: hidden; }
.viewfinder { background: #1D1A2B; border: none; }
.viewfinder .corner { position: absolute; width: 36px; height: 36px; border: 4px solid #fff; }
.viewfinder .scanline { position: absolute; left: 20px; right: 20px; height: 2px; background: var(--pink); box-shadow: 0 0 12px var(--pink); animation: scan 1.6s ease-in-out infinite alternate; }
@keyframes scan { from { top: 30px; } to { top: 206px; } }
.progress { width: 100%; height: 8px; border-radius: 999px; background: var(--chip); overflow: hidden; }
.progress > div { height: 8px; border-radius: 999px; background: var(--pink); transition: width 1s ease; }

/* Events */
.alert { margin: 8px 12px 0; background: var(--ink); color: #fff; border-radius: 18px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; box-shadow: 0 12px 30px rgba(29,26,43,.25); border: none; text-align: left; width: calc(100% - 24px); animation: drop .5s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes drop { from { transform: translateY(-120%); opacity: 0; } }
.stack { display: flex; }
.stack .av + .av { margin-left: -10px; }
.ecard { border-radius: 18px; padding: 16px; }
.ecard.hot { border: 2px solid var(--pink); }
.ecard .when { font-size: 12px; font-weight: 700; color: var(--muted); }
.ecard.hot .when { color: var(--pink-ink); }
.ecard h2 { font-size: 20px; margin-top: 4px; }
.ecard .who { font-size: 13px; color: var(--muted); margin-top: 4px; }

/* Who did you meet */
.grid4 { padding: 10px 20px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 12px; }
.face { border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; }
.face span { font-size: 12px; }
.face.sel span { font-weight: 700; }
.search { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line-2); background: #fff; padding: 0 14px; font: inherit; font-size: 14px; }
.sticky-bottom { position: sticky; bottom: 0; background: linear-gradient(to top, var(--ivory) 75%, rgba(246,243,238,0)); }

/* Swipe */
.deck { flex-grow: 1; display: flex; align-items: center; justify-content: center; position: relative; min-height: 470px; }
.deck .behind { position: absolute; width: 300px; height: 440px; border-radius: 28px; background: var(--chip); transform: rotate(-4deg); }
.scard { position: relative; width: 310px; height: 450px; border-radius: 28px; background: #fff; box-shadow: 0 20px 40px rgba(29,26,43,.12); display: flex; flex-direction: column; overflow: hidden; transform: rotate(3deg); touch-action: none; user-select: none; cursor: grab; }
.scard.drag { transition: none; cursor: grabbing; }
.scard.fly { transition: transform .35s ease-in, opacity .35s; }
.scard .hero { height: 200px; display: flex; align-items: center; justify-content: center; color: #fff; font-family: var(--serif); font-size: 64px; font-weight: 600; }
.scard .stamp { position: absolute; top: 24px; padding: 6px 12px; border: 3px solid; border-radius: 10px; font-weight: 700; font-size: 18px; opacity: 0; background: rgba(255,255,255,.9); }
.scard .stamp.keep { left: 20px; color: var(--purple); transform: rotate(-12deg); }
.scard .stamp.nice { right: 20px; color: var(--muted); transform: rotate(12deg); }
.choice { flex-grow: 1; height: 64px; border-radius: 18px; font-size: 15px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.choice small { font-size: 11px; font-weight: 400; }

/* Chat */
.chat-head { padding: 12px 20px 14px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); background: #fff; }
.nudge { margin: 16px 20px 0; background: var(--purple-soft); border-radius: 16px; padding: 14px 16px; }
.msgs { flex-grow: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; justify-content: flex-end; }
.msg { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.4; animation: cardIn .3s ease both; }
.msg.me { align-self: flex-end; background: var(--purple); color: #fff; border-bottom-right-radius: 6px; }
.msg.them { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.msg-meta { align-self: flex-end; font-size: 12px; color: var(--muted); }
.slot { height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: #fff; color: var(--ink); font-size: 13px; }
.slot.on { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 700; }
.composer { margin: 0 12px 20px; background: #fff; border-radius: 20px; border: 1.5px solid var(--purple); padding: 12px; }
.composer textarea { width: 100%; height: 96px; border: none; resize: none; font: inherit; font-size: 15px; line-height: 1.4; color: var(--ink); padding: 6px 0; background: transparent; }
.composer textarea:focus-visible { outline: none; }
.thread-row { display: flex; gap: 12px; align-items: center; padding: 14px; width: 100%; text-align: left; }

.empty { text-align: center; color: var(--muted); padding: 48px 32px; font-size: 14px; line-height: 1.5; }
.empty h2 { color: var(--ink); font-size: 22px; margin-bottom: 8px; }

/* Toast */
.toast { position: absolute; left: 16px; right: 16px; bottom: 92px; background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 14px; font-size: 14px; z-index: 30; animation: up .25s ease both; box-shadow: 0 10px 24px rgba(29,26,43,.3); }

/* Confetti burst for unlocks */
.burst { position: absolute; pointer-events: none; z-index: 25; }
.burst i { position: absolute; width: 8px; height: 8px; border-radius: 2px; animation: burst .9s ease-out forwards; }
@keyframes burst { to { transform: translate(var(--dx), var(--dy)) rotate(260deg); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------- v2: menus, safety, profile, calendar, invites ---------- */
.dots { border: none; background: none; width: 44px; height: 44px; border-radius: 50%; color: var(--ink); display: flex; align-items: center; justify-content: center; }
.dots:hover { background: var(--chip); }
.menu-row { font-weight: 500; }
.menu-row.danger { color: #B3261E; }
.btn.danger { background: #B3261E; color: #fff; }
.banner { margin: 12px 20px 0; padding: 12px 14px; border-radius: 14px; font-size: 13px; line-height: 1.4; }
.banner.warn { background: #FDECEA; color: #8C1D18; }
.banner.info { background: var(--purple-soft); color: var(--purple); }
.radio-row { display: flex; gap: 12px; align-items: center; width: 100%; min-height: 52px; border: none; border-bottom: 1px solid var(--line); background: none; font-size: 15px; text-align: left; padding: 0 2px; }
.radio-row .rb { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-2); flex-shrink: 0; }
.radio-row.on .rb { border: 7px solid var(--purple); }
.field { width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--line-2); background: #fff; padding: 0 14px; font: inherit; font-size: 15px; color: var(--ink); }
textarea.field { height: 88px; padding: 12px 14px; resize: none; }
.check { display: flex; gap: 10px; align-items: center; font-size: 14px; margin: 12px 0; }
.check input { width: 20px; height: 20px; accent-color: var(--purple); }

/* Onboarding + my profile */
.steps { display: flex; gap: 6px; padding: 0 20px; }
.steps i { flex: 1; height: 4px; border-radius: 4px; background: var(--line-2); }
.steps i.on { background: var(--purple); }
.pick { height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: #fff; color: var(--ink); font-size: 14px; }
.pick.on { background: var(--purple); border-color: var(--purple); color: #fff; font-weight: 700; }
.pick:disabled { opacity: .4; }
.ob-section { padding: 16px 20px 0; }
.set-row { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 56px; padding: 0 16px; border: none; border-bottom: 1px solid var(--line); background: #fff; font-size: 15px; text-align: left; }
.set-row:last-child { border-bottom: none; }
.set-row .ct { color: var(--muted); font-size: 13px; }
.me-btn { border: none; padding: 0; background: none; border-radius: 50%; }

/* Composer tools */
.tool { border: none; background: none; color: var(--muted); font-size: 13px; font-weight: 700; min-height: 44px; padding: 0 8px; }
.tool:hover { color: var(--purple); }
.cal-card { margin: 0 20px 10px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
.cal-card .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--purple-soft); color: var(--purple); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* Week view */
.week { display: grid; grid-template-columns: 44px repeat(3, 1fr); gap: 4px; font-size: 11px; }
.week .h { color: var(--muted); text-align: right; padding-right: 4px; line-height: 34px; }
.week .d { text-align: center; font-weight: 700; font-size: 13px; padding-bottom: 4px; }
.week .c { height: 34px; border-radius: 8px; padding: 3px 6px; overflow: hidden; line-height: 1.2; border: none; text-align: left; font: inherit; font-size: 11px; }
.week .c.mine { background: #E9E5EE; color: var(--ink-2); }
.week .c.theirs { background: repeating-linear-gradient(45deg, #F3F1F6, #F3F1F6 4px, #E9E5EE 4px, #E9E5EE 8px); color: var(--muted); }
.week .c.free { background: #fff; border: 1px dashed var(--line-2); }
.week .c.both { background: var(--purple-soft); color: var(--purple); font-weight: 700; border: 1.5px solid var(--purple); cursor: pointer; }
.week .c.both.on { background: var(--purple); color: #fff; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 10px 0 14px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }

/* Fake OAuth + invite pages */
.oauth { text-align: center; }
.oauth .apps { display: flex; justify-content: center; align-items: center; gap: 12px; margin: 8px 0 14px; }
.oauth .app { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; }
.oauth ul { text-align: left; font-size: 14px; color: var(--ink-2); padding-left: 20px; line-height: 1.6; }
.browserbar { padding: 10px 12px 10px; background: #F1F0F4; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.browserbar .url { flex: 1; height: 36px; border-radius: 10px; background: #fff; display: flex; align-items: center; gap: 6px; padding: 0 12px; font-size: 13px; color: var(--ink-2); overflow: hidden; white-space: nowrap; }
.browserbar .done { border: none; background: none; color: var(--purple); font-weight: 700; font-size: 15px; min-height: 40px; padding: 0 6px; }
.appswitch { position: absolute; inset: 0; z-index: 40; background: var(--ivory); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 14px; color: var(--muted); animation: fade .15s both; }
.appswitch .spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line-2); border-top-color: var(--purple); animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.invite { flex-grow: 1; overflow-y: auto; animation: slideIn .3s ease both; }
@keyframes slideIn { from { transform: translateX(40px); opacity: 0; } }
.invite .hero { padding: 28px 20px 24px; color: #fff; }
.invite .hero h1 { font-size: 30px; margin-top: 6px; }
.invite .body { padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 14px; }
.invite .row { display: flex; gap: 12px; font-size: 14px; }
.invite .row b { display: block; }

/* My network bubbles */
.net-zone { display: flex; justify-content: center; align-items: center; gap: 18px; min-height: 190px; padding: 8px 20px 14px; }
.net-bubble { border: none; border-radius: 50%; background: var(--c); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; transition: width .5s cubic-bezier(.3,1.4,.5,1), height .5s cubic-bezier(.3,1.4,.5,1), transform .15s; animation: chipIn .4s ease both; }
.net-bubble:not(.on) { opacity: .82; }
.net-bubble:active { transform: scale(.96); }
.net-bubble .n { font-family: var(--serif); font-size: 34px; font-weight: 600; line-height: 1; }
.net-bubble .l { font-size: 12px; font-weight: 700; margin-top: 4px; }
.opt.sel { background: var(--ink); color: #fff; border-color: var(--ink); }
.move-btn { border: 1px solid var(--line-2); background: #fff; color: var(--ink); border-radius: 12px; font-size: 12px; font-weight: 700; padding: 6px 10px; min-height: 40px; line-height: 1.2; flex-shrink: 0; }
.move-btn.keep { background: var(--purple); border-color: var(--purple); color: #fff; }
.net-mini { flex: 1; height: 44px; border-radius: 999px; border: 1px solid var(--line-2); background: #fff; font-size: 13px; font-weight: 700; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 8px; }
.net-mini i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); }

/* Follow-up agent */
.agent-card { margin: 12px 20px 0; padding: 14px; border-radius: 18px; background: #fff; border: 1.5px solid var(--purple-soft); display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 24px rgba(78,42,132,.08); }
.agent-ic { width: 36px; height: 36px; border-radius: 12px; background: var(--purple); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.agent-ic.live { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(78,42,132,.15); } }
.agent-log { background: var(--ivory); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; line-height: 1.45; color: var(--ink-2); display: flex; flex-direction: column; gap: 3px; position: relative; }
.agent-log .summary, .agent-log .queue { color: var(--purple); font-weight: 700; }
.agent-log .warn { color: #8A5A00; }
.spin-sm { position: absolute; top: 10px; right: 10px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--purple); animation: spin .7s linear infinite; }
.approve { padding: 14px; border: 1.5px solid var(--pink); }
.approve .src { font-size: 11px; font-weight: 700; color: var(--purple); background: var(--purple-soft); padding: 3px 8px; border-radius: 999px; }
.log-row { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.log-row.summary div, .log-row.queue div { color: var(--purple); font-weight: 700; }
.log-row.start div { font-weight: 700; }
.net-pick { flex: 1; height: 48px; border-radius: 999px; border: 1.5px solid var(--line-2); background: #fff; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 6px; font-size: 13px; font-weight: 700; color: var(--ink); }

  <script>
/* state.js */
// state.js: everything the user changes, saved in this browser.
// Reset: double-click the "Explore" title, Shift+R, or add ?reset to the URL.

(function () {
  const KEY = "kellogg-connect-v1";
  const D = window.KC_DATA;

  const DAY = 86400000;
  // Days since you last talked to each pod mate at the start of the demo.
  const SEED_DAYS_AGO = { "s-priya": 2, "s-diego": 16, "s-hana": 6, "s-marcus": 4, "s-lena": 9 };

  function fresh() {
    const met = {}, contacts = {};
    Object.entries(SEED_DAYS_AGO).forEach(([id, d]) => { contacts[id] = Date.now() - d * DAY; });
    // Pod mates were met during orientation (CIM).
    D.DEFAULT_ME.pod.forEach((id) => { met[id] = { at: "at CIM", status: "keep" }; });
    const threads = {};
    Object.entries(D.SEED_THREADS).forEach(([id, t]) => {
      const at = Date.now() - t.daysAgo * DAY;
      threads[id] = { slot: null, draft: "", created: at, messages: t.messages.map((m, i) => Object.assign({ at: at - (t.messages.length - 1 - i) * 3600000 }, m)) };
    });
    return {
      onboarded: false,  // has the user built (or skipped) their profile?
      profile: null,     // the user's own profile fields (overrides the demo profile)
      list: [],          // People I want to meet
      met,               // id -> { at, status: "keep" | "nice" | null }
      notes: {},         // id -> private note
      filters: [],       // [{ key, value }]
      going: [],         // event ids
      ended: [],         // event ids logged as "over"
      threads,           // id -> { slot, draft, messages: [] }
      calendar: false,   // Google Calendar connected (faked)
      blocked: [],       // ids the user blocked
      reports: [],       // [{ id, reason, details, at, status: "open" | "restricted" | "dismissed" }]
      restricted: [],    // ids the safety team restricted
      contacts,          // id -> timestamp you last talked (met, or a message)
      agent: {           // follow-up agent (agent.js)
        enabled: true,
        thresholdDays: 14,
        clockOffsetDays: 0, // demo "fast-forward"
        lastRun: 0,         // 0 = run on first launch so the demo opens with a nudge ready
        queue: [],          // [{ id, message, reason, days, source, at }]
        log: [],            // [{ at, text, kind }]
        snoozed: {},        // id -> timestamp
      },
    };
  }

  function load() {
    try {
      if (/[?&]reset\b/.test(location.search)) { localStorage.removeItem(KEY); history.replaceState(null, "", location.pathname); }
      const raw = localStorage.getItem(KEY);
      if (raw) return Object.assign(fresh(), JSON.parse(raw));
    } catch (e) { /* storage blocked: run in memory */ }
    return fresh();
  }

  const state = load();

  // The user's profile lives in D.ME so every screen reads one place.
  function applyProfile() {
    Object.keys(D.ME).forEach((k) => delete D.ME[k]);
    Object.assign(D.ME, JSON.parse(JSON.stringify(D.DEFAULT_ME)), state.profile || {});
    D.ME.name = D.ME.first + " " + D.ME.last;
    D.ME.initials = (D.ME.first[0] || "") + (D.ME.last[0] || "");
  }
  applyProfile();

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  function reset() {
    const f = fresh();
    Object.keys(state).forEach((k) => delete state[k]);
    Object.assign(state, f);
    applyProfile();
    save();
  }

  const S = {
    state, save, reset, applyProfile,
    DAY,
    now: () => Date.now() + (state.agent.clockOffsetDays || 0) * DAY,
    daysSince: (id) => (state.contacts[id] ? Math.floor((S.now() - state.contacts[id]) / DAY) : null),
    touch(id) { state.contacts[id] = S.now(); save(); },
    isMet: (id) => !!state.met[id],
    onList: (id) => state.list.includes(id),
    metCount: () => Object.keys(state.met).length,
    isBlocked: (id) => state.blocked.includes(id),
    isRestricted: (id) => state.restricted.includes(id),
    // Blocked and restricted people disappear from Explore, events and "who did you meet".
    visible: (id) => !state.blocked.includes(id) && !state.restricted.includes(id),
    addToList(id) { if (!state.list.includes(id) && !state.met[id]) { state.list.push(id); save(); } },
    removeFromList(id) { state.list = state.list.filter((x) => x !== id); save(); },
    markMet(id, at) {
      if (!state.met[id]) { state.met[id] = { at: at || "in person", status: null, fresh: true }; state.contacts[id] = S.now(); }
      state.list = state.list.filter((x) => x !== id);
      save();
    },
    setStatus(id, status) { if (state.met[id]) { state.met[id].status = status; delete state.met[id].fresh; save(); } },
    setNote(id, text) { state.notes[id] = text; save(); },
    deleteThread(id) { delete state.threads[id]; save(); },
    removeKeep(id) { if (state.met[id]) state.met[id].status = "nice"; delete state.threads[id]; save(); },
    block(id) {
      if (!state.blocked.includes(id)) state.blocked.push(id);
      state.list = state.list.filter((x) => x !== id);
      delete state.threads[id];
      save();
    },
    unblock(id) { state.blocked = state.blocked.filter((x) => x !== id); save(); },
    report(id, reason, details) { state.reports.push({ id, reason, details, at: Date.now(), status: "open" }); save(); },
    setProfile(p) { state.profile = p; state.onboarded = true; applyProfile(); save(); },
  };

  window.KC_STATE = S;
})();

  <script>
/* app.js */
// app.js: screen switching, bottom tabs and shared helpers.
// Each feature file registers screens with KC.screen(name, { tab, render(params, el) }).

(function () {
  const D = window.KC_DATA, S = window.KC_STATE;
  const screens = {};
  let stack = [];          // navigation history: [{ name, params }]
  let current = null;

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function avatar(p, size, opts) {
    opts = opts || {};
    const met = opts.forceColor || S.isMet(p.id);
    const fs = opts.fontSize || Math.round(size * (size >= 100 ? 0.32 : 0.3));
    const style = [`width:${size}px`, `height:${size}px`, `font-size:${fs}px`];
    if (met) style.push(`background:${p.color}`);
    if (opts.ring) style.push(`box-shadow:0 0 0 3px ${opts.ringBg || "#F6F3EE"},0 0 0 5px ${met ? p.color : "#8A849A"}`);
    if (opts.border) style.push(`border:2px solid ${opts.border}`);
    if (opts.serif) style.push("font-family:var(--serif);font-weight:600");
    return `<div class="av ${met ? "met" : ""} ${opts.cls || ""}" style="${style.join(";")}" aria-hidden="true">${esc(p.initials)}</div>`;
  }

  const ICONS = {
    explore: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
    scan: '<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 12h8"/>',
    events: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    chats: '<path d="M5 18l-1 3 4-2h9a3 3 0 0 0 3-3V8a3 3 0 0 0-3-3H7a3 3 0 0 0-3 3v7a3 3 0 0 0 1 3z"/>',
  };
  const TABS = [["explore", "Explore"], ["scan", "Scan"], ["events", "Events"], ["chats", "Chats"]];

  function tabBar(active) {
    const badges = { events: KC.eventAlertCount && KC.eventAlertCount() > 0, chats: (KC.unsentCount && KC.unsentCount() > 0) || (KC.agentQueueCount && KC.agentQueueCount() > 0) };
    return `<nav class="tabbar" aria-label="Main">${TABS.map(([k, label]) =>
      `<button data-tab="${k}" class="${k === active ? "active" : ""}" ${k === active ? 'aria-current="page"' : ""}>
        <svg viewBox="0 0 24 24">${ICONS[k]}</svg>${label}${badges[k] ? '<span class="dot" aria-label="new"></span>' : ""}</button>`).join("")}</nav>`;
  }

  function render(animate) {
    const phone = document.getElementById("phone");
    const def = screens[current.name];
    phone.innerHTML = `<header class="brand"><div class="slot-l"></div><button id="brand" aria-label="Kompass, go to Explore">Kompass</button><div class="slot-r"></div></header><main class="screen ${animate ? "enter" : ""}" id="screen"></main>${def.tab ? tabBar(def.tab) : ""}`;
    phone.querySelector("#brand").addEventListener("click", () => { if (S.state.onboarded) KC.tab("explore"); });
    const el = phone.querySelector("#screen");
    def.render(current.params || {}, el);
    // A screen's own Back button and ••• menu sit in the Kompass bar (they keep their click handlers).
    const back = el.querySelector(":scope > .back"), more = el.querySelector(":scope > .top-right");
    if (back) phone.querySelector(".slot-l").appendChild(back);
    if (more) phone.querySelector(".slot-r").appendChild(more);
    phone.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => KC.tab(b.dataset.tab)));
    if (def.tab && KC.agentMaybeRun) setTimeout(KC.agentMaybeRun, 600); // follow-up agent's daily check
  }

  function toast(msg, ms) {
    const phone = document.getElementById("phone");
    phone.querySelectorAll(".toast").forEach((t) => t.remove());
    const t = document.createElement("div");
    t.className = "toast"; t.setAttribute("role", "status"); t.innerHTML = msg;
    phone.appendChild(t);
    setTimeout(() => t.remove(), ms || 2400);
  }

  function burst(targetEl, colors) {
    if (!targetEl) return;
    const phone = document.getElementById("phone");
    const pr = phone.getBoundingClientRect(), r = targetEl.getBoundingClientRect();
    const k = pr.width / phone.offsetWidth || 1; // phone may be scaled to fit the window
    const b = document.createElement("div");
    b.className = "burst";
    b.style.left = (r.left - pr.left + r.width / 2) / k + "px";
    b.style.top = (r.top - pr.top + r.height / 2) / k + "px";
    colors = colors || ["#E4577E", "#4E2A84", "#F2B8C9", "#2F7D6D", "#D97757"];
    for (let i = 0; i < 22; i++) {
      const p = document.createElement("i");
      const a = (Math.PI * 2 * i) / 22, d = 60 + Math.random() * 60;
      p.style.background = colors[i % colors.length];
      p.style.setProperty("--dx", Math.cos(a) * d + "px");
      p.style.setProperty("--dy", Math.sin(a) * d + "px");
      b.appendChild(p);
    }
    phone.appendChild(b);
    setTimeout(() => b.remove(), 1000);
  }

  function sheet(title, bodyHtml, onMount) {
    const phone = document.getElementById("phone");
    const bg = document.createElement("div"); bg.className = "sheet-bg";
    const sh = document.createElement("div"); sh.className = "sheet"; sh.setAttribute("role", "dialog"); sh.setAttribute("aria-label", title);
    sh.innerHTML = `<div class="sheet-head"><h2>${esc(title)}</h2><button class="x" aria-label="Close">×</button></div><div class="sheet-body">${bodyHtml}</div>`;
    const close = () => { bg.remove(); sh.remove(); };
    bg.addEventListener("click", close);
    sh.querySelector(".x").addEventListener("click", close);
    phone.appendChild(bg); phone.appendChild(sh);
    if (onMount) onMount(sh.querySelector(".sheet-body"), close);
    return close;
  }

  const KC = window.KC = {
    esc, avatar, toast, burst, sheet, D, S,
    screen(name, def) { screens[name] = def; },
    go(name, params, opts) {
      if (current && !(opts && opts.replace)) stack.push(current);
      current = { name, params: params || {} };
      render(!(opts && opts.replace)); // in-place updates don't fade
    },
    back() {
      current = stack.pop() || { name: "explore", params: {} };
      render(true);
    },
    tab(name) { stack = []; current = { name, params: {} }; render(true); },
    // Redraw just the bottom tabs (e.g. a new badge) without touching the screen.
    refreshTabs() {
      const nav = document.querySelector("#phone .tabbar"), def = screens[current.name];
      if (!nav || !def.tab) return;
      nav.outerHTML = tabBar(def.tab);
      document.querySelectorAll("#phone [data-tab]").forEach((b) => b.addEventListener("click", () => KC.tab(b.dataset.tab)));
    },
    refresh() { render(false); },
    resetDemo() {
      if (!confirm("Reset the demo to a fresh start?")) return;
      S.reset(); stack = []; current = KC.home(); render(true);
      toast("Demo reset");
    },
    peopleWord: (n) => n === 1 ? "person" : "people",
    // First launch builds a profile; after that the app opens on Explore.
    home: () => (S.state.onboarded ? { name: "explore", params: {} } : { name: "onboard", params: { step: 0 } }),

    // Action sheet: items = [{ label, sub, danger, onClick }]
    menu(title, items) {
      KC.sheet(title, items.map((it, i) =>
        `<button class="sheet-row menu-row ${it.danger ? "danger" : ""}" data-i="${i}"><span>${esc(it.label)}${it.sub ? `<br><span class="ct">${esc(it.sub)}</span>` : ""}</span></button>`).join(""),
        (body, close) => body.querySelectorAll("[data-i]").forEach((b) => b.addEventListener("click", () => { close(); items[+b.dataset.i].onClick(); })));
    },
    // Confirmation sheet with one action button.
    confirm(title, body, actionLabel, onYes, danger) {
      KC.sheet(title, `<div style="font-size:14px;color:var(--ink-2);line-height:1.5;margin-bottom:16px">${body}</div>
        <div style="display:flex;gap:10px"><button class="btn ghost" style="flex-grow:1" data-no>Cancel</button>
        <button class="btn ${danger ? "danger" : "primary"}" style="flex-grow:1" data-yes>${esc(actionLabel)}</button></div>`,
        (b, close) => { b.querySelector("[data-no]").addEventListener("click", close); b.querySelector("[data-yes]").addEventListener("click", () => { close(); onYes(); }); });
    },
    dotsBtn: (id) => `<button class="dots" id="${id || "dots"}" aria-label="More options"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>`,
  };

  // Shrink the phone frame to fit short laptop screens.
  function fit() {
    const phone = document.getElementById("phone");
    if (window.innerWidth <= 440) { phone.style.transform = ""; return; }
    const k = Math.min(1, (window.innerHeight - 40) / 864, (window.innerWidth - 40) / 410);
    phone.style.transform = k < 1 ? `scale(${k})` : "";
  }
  window.addEventListener("resize", fit);

  document.addEventListener("DOMContentLoaded", () => {
    fit();
    current = KC.home();
    render(true);
  });
})();

</script>
  <script>
/* explore.js */
// explore.js: the shrinking bubble, filters, and the people cards it pops into.

(function () {
  const { D, S, esc, avatar } = window.KC;
  const POP_AT = 12;              // bubble pops into cards at this many matches or fewer
  const SEE_ALL_AT = 60;          // offer "see these people" below this
  let lastCount = D.CLASS_SIZE;   // for animating the bubble between renders

  // ---------- matching ----------
  // "My network" isn't stored on the person; it comes from who you've met and how you sorted them.
  const NET = { keep: "Keep in touch", nice: "Nice to meet", unsorted: "Met, not sorted", list: "Want to meet", none: "Haven't met" };
  const NET_COLOR = { [NET.keep]: "#4E2A84", [NET.nice]: "#2F7D6D" };
  function networkOf(p) {
    const m = S.state.met[p.id];
    if (m) return m.status === "keep" ? NET.keep : m.status === "nice" ? NET.nice : NET.unsorted;
    return S.onList(p.id) ? NET.list : NET.none;
  }
  const valueOf = (p, key) => (key === "network" ? networkOf(p) : p[key]);

  function matchOne(p, f) {
    const v = valueOf(p, f.key);
    return Array.isArray(v) ? v.includes(f.value) : v === f.value;
  }
  function matches(filters) {
    return D.STUDENTS.filter((p) => S.visible(p.id) && filters.every((f) => matchOne(p, f)));
  }
  function trail(filters) {
    const out = [D.CLASS_SIZE];
    for (let i = 1; i <= filters.length; i++) out.push(matches(filters.slice(0, i)).length);
    return out;
  }
  const bubbleSize = (n) => Math.round(96 + 154 * Math.sqrt(Math.min(n, D.CLASS_SIZE) / D.CLASS_SIZE));
  const catLabel = (key) => D.FILTER_CATEGORIES.find((c) => c.key === key).label;

  // ---------- shared person helpers ----------
  // "2Y · Hammerheads · Japan KWEST · Tech", skipping anything left empty.
  KC.metaLine = (p) => [p.program, p.section, p.kwest && D.kwestLabel(p.kwest), p.career].filter(Boolean).join(" · ");
  KC.prevLabel = (p) => (/^[A-Z]/.test(p.prev) ? "ex-" + p.prev : p.prev);
  KC.metLine = (p) => {
    const m = S.state.met[p.id];
    if (!m) return "";
    const st = m.status === "keep" ? " · Keep in touch" : m.status === "nice" ? " · Nice to meet" : "";
    return `Met ${m.at}${st}`;
  };

  KC.personCard = function (p, i) {
    const met = S.isMet(p.id), on = S.onList(p.id);
    const btn = met ? "" : `<button class="meet-btn ${on ? "on" : ""}" data-meet="${p.id}" aria-pressed="${on}">${on ? "On list" : "+ Meet"}</button>`;
    return `<div class="card pcard" style="animation-delay:${(i || 0) * 60}ms">
      ${avatar(p, 52)}
      <div class="body" data-profile="${p.id}" role="button" tabindex="0" aria-label="Open ${esc(p.name)}'s profile">
        <div class="name">${esc(p.name)}</div>
        <div class="meta">${esc(p.program)} · Section ${esc(p.section)} · ${esc(KC.prevLabel(p))}</div>
        ${met ? `<div class="open ok">${esc(KC.metLine(p))}</div>` : `<div class="open">Open to: ${esc(p.openTo.join(", ").toLowerCase())}</div>`}
      </div>${btn}</div>`;
  };

  // Wire up "+ Meet" and profile taps inside a container.
  KC.wireCards = function (el, onChange) {
    el.querySelectorAll("[data-meet]").forEach((b) => b.addEventListener("click", () => {
      const id = b.dataset.meet;
      if (S.onList(id)) { S.removeFromList(id); }
      else { S.addToList(id); KC.toast(`<strong>${esc(D.byId[id].first)}</strong> added to People I Want to Meet`); }
      const on = S.onList(id);
      b.classList.toggle("on", on); b.textContent = on ? "On list" : "+ Meet"; b.setAttribute("aria-pressed", on);
      if (onChange) onChange();
    }));
    el.querySelectorAll("[data-profile]").forEach((b) => {
      const open = () => KC.go("profile", { id: b.dataset.profile });
      b.addEventListener("click", open);
      b.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
    });
  };

  // ---------- filter sheets ----------
  function openCategory(key) {
    const cat = D.FILTER_CATEGORIES.find((c) => c.key === key);
    const pool = matches(S.state.filters);
    const counts = {};
    pool.forEach((p) => [].concat(valueOf(p, key)).forEach((v) => { counts[v] = (counts[v] || 0) + 1; }));
    // Most common first; "Didn't go" always sits at the end of the KWEST list.
    const rows = Object.entries(counts).sort((a, b) => (a[0] === D.NO_KWEST) - (b[0] === D.NO_KWEST) || b[1] - a[1]);

      `<button class="sheet-row" data-v="${esc(v)}"><span>${esc(v)}</span><span class="ct">${n}</span></button>`).join(""),
      (body, close) => body.querySelectorAll("[data-v]").forEach((b) => b.addEventListener("click", () => {

        KC.refresh();
      })));
  }
  function openAddFilter() {
    const used = S.state.filters.map((f) => f.key);
    const cats = D.FILTER_CATEGORIES.filter((c) => c.multi || !used.includes(c.key));
    KC.sheet("Add a filter", cats.map((c) =>
      `<button class="sheet-row" data-k="${c.key}"><span>${c.label}</span><span class="ct">›</span></button>`).join(""),
      (body, close) => body.querySelectorAll("[data-k]").forEach((b) => b.addEventListener("click", () => { close(); openCategory(b.dataset.k); })));
  }

  // ---------- Explore (the bubble) ----------
  KC.screen("explore", {
    tab: "explore",
    render(_, el) {
      const filters = S.state.filters;
      const list = matches(filters);
      const n = list.length;
      const t = trail(filters);
      const used = filters.map((f) => f.key);
      const narrow = D.FILTER_CATEGORIES.filter((c) => !used.includes(c.key) && c.key !== "network");
      const netFilter = filters.find((f) => f.key === "network");
      const netColor = netFilter && NET_COLOR[netFilter.value];
      const from = lastCount;

      el.innerHTML = `
        <div class="head row">
          <h1 class="title" id="explore-title" title="Double-click to reset the demo">Explore</h1>
          <div style="display:flex;gap:10px;align-items:center">
            <button class="pill-count" id="met-pill" aria-label="My network: met ${S.metCount()} of ${D.CLASS_SIZE}">Met ${S.metCount()} of ${D.CLASS_SIZE}</button>
            <button class="me-btn" id="me-btn" aria-label="My profile">${avatar(D.ME, 40, { forceColor: true, fontSize: 14 })}</button>
          </div>
        </div>
        <div class="pad wrap">
          ${filters.map((f, i) => `<button class="chip ${i === filters.length - 1 ? "pop" : ""}" data-rm="${i}" aria-label="Remove ${esc(f.value)} filter">${esc(f.key === "kwest" && f.value === D.NO_KWEST ? D.kwestLabel(f.value) : f.value)} ×</button>`).join("")}
          <button class="chip add" id="add-filter">+ Add filter</button>
        </div>
        <div class="bubble-zone">
          <div class="ring r1"><div class="ring r2"></div></div>
          <button class="bubble" id="bubble" style="width:${bubbleSize(from)}px;height:${bubbleSize(from)}px;${netColor ? `background:${netColor};box-shadow:0 20px 40px ${netColor}55` : ""}" aria-label="${n} people match">
            <div class="n" id="bubble-n">${from}</div>
            <div class="l">${n === 1 ? "person matches" : "people match"}</div>
          </button>
          ${t.length > 1 ? `<div class="trail">${t.slice(-4).join(" → ")}</div>` : `<div class="trail">Your whole class. Add a filter to shrink the bubble.</div>`}
          ${filters.length && n > POP_AT && n <= SEE_ALL_AT ? `<div class="see-all"><button class="linkbtn" id="see-all">See these ${n} people →</button></div>` : ""}
          ${n === 0 ? `<div class="see-all" style="color:var(--muted);font-size:13px">No one matches. Tap a chip to remove it.</div>` : ""}
        </div>
        <div class="pad" style="padding-bottom:14px">
          <div class="label">Your network</div>
          <div style="display:flex;gap:10px">${[NET.keep, NET.nice].map((g) => {
            const on = netFilter && netFilter.value === g;
            const count = D.STUDENTS.filter((p) => S.visible(p.id) && networkOf(p) === g).length;
            return `<button class="net-pick ${on ? "on" : ""}" data-net="${g}" aria-pressed="${on}" style="--c:${NET_COLOR[g]}">
              <span class="dot">${count}</span><span>${g}</span>${on ? `<span class="x-mark" aria-hidden="true">×</span>` : ""}</button>`;
          }).join("")}</div>
        </div>
        <div style="padding:0 20px 16px">
          <div class="label">${filters.length ? "Keep narrowing" : "Start narrowing"}</div>
          <div class="wrap">${narrow.map((c) => `<button class="opt" data-cat="${c.key}">${c.label}</button>`).join("")}</div>
        </div>`;

      // Animate bubble size + number from the previous count.
      const bubble = el.querySelector("#bubble"), num = el.querySelector("#bubble-n");
      requestAnimationFrame(() => requestAnimationFrame(() => {
        bubble.style.width = bubble.style.height = bubbleSize(n) + "px";
      }));

        const start = performance.now(), dur = 600;
        const step = (now) => {

          <button class="back" id="back">‹ Bubble</button>

              <div class="sub" style="font-size:13px;margin-top:2px">${esc(filters.map((f) => f.key === "kwest" ? D.kwestLabel(f.value) : f.value).join(" · ") || "Everyone")}</div></div>

          <div class="pad" style="font-size:13px;color:var(--muted);padding-top:4px">The bubble popped. Gray means you haven't met yet.</div>
          <div class="people grow" id="cards">${list.map((p, i) => KC.personCard(p, i)).join("")}</div>
          ${addable.length ? `<div class="sticky-bottom" style="padding:8px 20px 16px"><button class="btn dark" style="width:100%;height:48px" id="add-all">Add ${addable.length === 1 ? "" : "all "}${addable.length} to People I Want to Meet</button></div>` : ""}`;
        el.querySelector("#back").addEventListener("click", () => KC.tab("explore"));
        KC.wireCards(el, () => { const y = el.scrollTop; draw(); el.querySelectorAll(".pcard").forEach((c) => (c.style.animation = "none")); el.scrollTop = y; });
        const all = el.querySelector("#add-all");
        if (all) all.addEventListener("click", () => {
          addable.forEach((p) => S.addToList(p.id));
          KC.toast(`Added ${addable.length} to People I Want to Meet`);
          draw();
          el.querySelectorAll(".pcard").forEach((c) => (c.style.animation = "none"));
        });
      };
      draw();
    },
  });

  // ---------- My network: Keep in touch + Nice to meet bubbles (from the "Met X of 520" pill) ----------
  const GROUPS = {
    keep: { label: "Keep in touch", color: "#4E2A84", shadow: "rgba(78,42,132,.3)" },
    nice: { label: "Nice to meet", color: "#2F7D6D", shadow: "rgba(47,125,109,.3)" },
  };
  function networkGroups() {
    const met = Object.keys(S.state.met).filter(S.visible).reverse();
    const status = (id) => S.state.met[id].status;
    return {
      keep: met.filter((id) => status(id) === "keep"),
      nice: met.filter((id) => status(id) === "nice"),
      unsorted: met.filter((id) => !status(id)),
      list: S.state.list.filter(S.visible),
    };
  }
  KC.networkCounts = () => { const g = networkGroups(); return { keep: g.keep.length, nice: g.nice.length }; };

  function moveTo(id, status) {
    const p = D.byId[id], t = S.state.threads[id];
    if (status === "keep") {
      S.setStatus(id, "keep"); KC.ensureThread(id);
      KC.toast(`${esc(p.first)} → Keep in touch. I drafted a follow-up in Chats.`);
      return KC.refresh();
    }
    const doIt = () => { S.setStatus(id, "nice"); S.deleteThread(id); KC.toast(`${esc(p.first)} → Nice to meet`); KC.refresh(); };
    if (t && t.messages.length) KC.confirm(`Move ${p.first} to Nice to meet?`, `Your chat with ${esc(p.first)} will be deleted from this phone.`, "Move", doIt);
    else doIt();
  }

  KC.screen("mypeople", {
    tab: "explore",
    render(params, el) {
      const g = networkGroups();
      const seg = params.seg || "keep";
      const maxN = Math.max(g.keep.length, g.nice.length, 1);
      const size = (n) => Math.round(84 + 66 * Math.sqrt(n / maxN));
      const bubble = (k) => {
        const G = GROUPS[k], n = g[k].length, on = seg === k;
        return `<button class="net-bubble ${on ? "on" : ""}" data-seg="${k}" aria-pressed="${on}"
            style="--c:${G.color};width:${size(n)}px;height:${size(n)}px;box-shadow:0 14px 30px ${G.shadow}${on ? `,0 0 0 4px var(--ivory),0 0 0 7px ${G.color}` : ""}">
            <span class="n">${n}</span><span class="l">${G.label}</span></button>`;
      };
      const shown = g[seg] || [];
      const card = (id, i) => {
        const p = D.byId[id], m = S.state.met[id];
        let action = "";
        if (seg === "keep") action = `<button class="move-btn" data-move="${id}" data-to="nice">Move to<br>Nice to meet</button>`;
        else if (seg === "nice") action = `<button class="move-btn" data-move="${id}" data-to="keep">Move to<br>Keep in touch</button>`;
        else if (seg === "unsorted") action = `<div style="display:flex;flex-direction:column;gap:6px">
            <button class="move-btn keep" data-move="${id}" data-to="keep">Keep in touch</button>
            <button class="move-btn" data-move="${id}" data-to="nice">Nice to meet</button></div>`;
        if (seg === "list") return KC.personCard(p, i);
        return `<div class="card pcard" style="animation-delay:${i * 50}ms">${avatar(p, 52)}
          <div class="body" data-profile="${id}" role="button" tabindex="0" aria-label="Open ${esc(p.name)}'s profile">
            <div class="name">${esc(p.name)}</div>
            <div class="meta">Met ${esc(m.at)}</div>
            <div class="meta">${esc(p.program)} · ${esc(KC.prevLabel(p))}</div>
          </div>${action}</div>`;
      };
      const EMPTY = {
        keep: "No one yet. After you meet someone, swipe <strong>Keep in touch</strong> and they land here.",
        nice: "No one yet. People you swipe <strong>Nice to meet</strong> stay in your network here.",
        unsorted: "Everyone you've met is sorted.",
        list: "Nobody on your list yet.<br>Shrink the bubble on Explore and tap <strong>+ Meet</strong>.",
      };
      const title = seg === "unsorted" ? "Not sorted yet" : seg === "list" ? "Want to meet" : GROUPS[seg].label;

      el.innerHTML = `
        <button class="back" id="back">‹ Explore</button>
        <div class="head"><h1 class="title">My network</h1>
          <div class="sub">You've met ${S.metCount()} of ${D.CLASS_SIZE} classmates. Only you can see how they're sorted.</div></div>
        <div class="net-zone">${bubble("keep")}${bubble("nice")}</div>
        <div class="pad wrap" style="justify-content:center">
          ${g.unsorted.length ? `<button class="opt ${seg === "unsorted" ? "sel" : ""}" data-seg="unsorted">Not sorted yet · ${g.unsorted.length}</button>` : ""}
          <button class="opt ${seg === "list" ? "sel" : ""}" data-seg="list">Want to meet · ${g.list.length}</button>
        </div>
        <div class="pad" style="padding-top:18px;display:flex;align-items:center;gap:8px">
          ${GROUPS[seg] ? `<i style="width:10px;height:10px;border-radius:50%;background:${GROUPS[seg].color}"></i>` : ""}
          <div class="caps">${esc(title.toUpperCase())} · ${shown.length}</div></div>
        <div class="people" style="padding-top:8px">${shown.length ? shown.map(card).join("") : `<div class="empty" style="padding:24px 16px">${EMPTY[seg]}</div>`}</div>`;

      el.querySelector("#back").addEventListener("click", () => KC.tab("explore"));
      el.querySelectorAll("[data-seg]").forEach((b) => b.addEventListener("click", () => KC.go("mypeople", { seg: b.dataset.seg }, { replace: true })));
      el.querySelectorAll("[data-move]").forEach((b) => b.addEventListener("click", () => moveTo(b.dataset.move, b.dataset.to)));
      KC.wireCards(el, () => KC.go("mypeople", { seg }, { replace: true }));
    },
  });

  // Reset shortcut: Shift+R
  document.addEventListener("keydown", (e) => {
    if (e.shiftKey && e.key === "R" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) KC.resetDemo();
  });
})();

  <script>
/* people.js */
// people.js: profile, private notes, "We've met" unlock, met counter, QR scan.

(function () {
  const { D, S, esc, avatar } = window.KC;

  function inCommon(p) {
    const me = D.ME, bits = [];
    const clubs = p.clubs.filter((c) => me.clubs.includes(c));
    if (clubs.length) bits.push(clubs.join(", "));
    const hobbies = p.hobbies.filter((h) => me.hobbies.includes(h));
    if (hobbies.length) bits.push("Both into " + hobbies.join(" & ").toLowerCase());
    if (me.section && p.section === me.section && !me.pod.includes(p.id)) bits.push("Also a " + p.section.replace(/s$/, ""));
    const wentKwest = p.kwest !== D.NO_KWEST;
    if (wentKwest && p.kwest === me.kwest) bits.push(`Both on ${p.kwest} KWEST`);
    if (!me.pod.includes(p.id) && wentKwest) {
      const podPal = me.pod.map((id) => D.byId[id]).find((q) => q.kwest === p.kwest);
      if (podPal) bits.push(`${podPal.name} (your pod) was on ${p.first}'s KWEST`);
    } else if (me.pod.includes(p.id)) bits.push("In your pod");
    return bits.length ? bits.join(" · ") : `You're both ${me.program && p.program === me.program ? p.program + "s" : "at Kellogg"}. Ask what brought them here!`;
  }

  function unlockFx(el, id) {
    const av = el.querySelector("[data-av]");
    if (av) { av.classList.add("unlock"); KC.burst(av, [D.byId[id].color, "#E4577E", "#4E2A84", "#F2B8C9"]); }
  }

  // ---------- Profile ----------
  KC.screen("profile", {
    tab: null,
    render(params, el) {
      const p = D.byId[params.id];
      const met = S.isMet(p.id), on = S.onList(p.id), m = S.state.met[p.id];
      const note = S.state.notes[p.id] || "";
      let actions;
      if (S.isBlocked(p.id)) {
        actions = `<button class="btn outline" id="unblock-btn">Unblock ${esc(p.first)}</button>`;
      } else if (S.isRestricted(p.id)) {
        actions = "";
      } else if (!met) {
        actions = `<button class="btn outline" id="list-btn">${on ? "✓ On my list" : "+ Add to my list"}</button>
                   <button class="btn primary" id="met-btn">We've met</button>`;
      } else if (!m.status) {
        actions = `<button class="btn ghost" data-status="nice" style="font-weight:700">Nice to meet</button>
                   <button class="btn primary" data-status="keep">Keep in touch</button>`;
      } else {
        actions = `<button class="btn primary" id="msg-btn">Message ${esc(p.first)}</button>`;
      }

      el.innerHTML = `
        <button class="back" id="back">‹ Back</button>
        <div class="top-right">${KC.dotsBtn()}</div>
        ${S.isRestricted(p.id) ? `<div class="banner warn" style="margin-top:8px">This account is restricted by Kellogg's safety team. You can't message ${esc(p.first)}.</div>` : ""}
        ${S.isBlocked(p.id) ? `<div class="banner warn" style="margin-top:8px">You blocked ${esc(p.first)}. They can't message you or see your events.</div>` : ""}
        <div style="padding:${S.isRestricted(p.id) || S.isBlocked(p.id) ? "16px" : "8px"} 20px 0;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
          <div data-av>${avatar(p, 112, { serif: true, fontSize: 36, cls: params.justMet ? "unlock" : "" })}</div>
          <div class="status-pill ${met ? "met" : ""}">${met ? esc(KC.metLine(p)) : "Not met yet"}</div>
          <h1 style="font-size:28px;margin-top:4px">${esc(p.name)}</h1>
          <div style="font-size:14px;color:var(--muted)">${esc(p.program)} · ${esc(p.section)} · ${esc(D.kwestLabel(p.kwest))} · ${esc(KC.prevLabel(p))}</div>
        </div>
        <div style="padding:20px 20px 0;display:flex;flex-direction:column;gap:16px" class="grow">
          <div><div class="label">Open to chat about</div>
            <div class="wrap">${p.openTo.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div></div>
          <div class="card info"><div class="label" style="margin:0">In common</div><div class="v">${esc(inCommon(p))}</div></div>
          <div class="card info"><div class="label" style="margin:0">Contact</div>
            ${met ? `<div class="v">${esc(p.linkedin)} · ${esc(p.first.toLowerCase())}@kellogg.northwestern.edu</div>`
                  : `<div class="locked"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Unlocks when you meet</div>`}</div>
          <div>
            <label for="notes" class="label" style="display:block;margin-bottom:6px">Private notes · only you can see this<span class="saved" id="saved">Saved</span></label>
            <textarea id="notes" class="notes" placeholder="What did you talk about? What do you want to ask?">${esc(note)}</textarea>
          </div>
        </div>
        ${actions ? `<div class="btn-row">${actions}</div>` : `<div style="height:28px"></div>`}`;

      if (params.justMet) setTimeout(() => KC.burst(el.querySelector("[data-av] .av"), [p.color, "#E4577E", "#4E2A84", "#F2B8C9"]), 150);

      el.querySelector("#back").addEventListener("click", KC.back);
      el.querySelector("#dots").addEventListener("click", () => KC.personMenu(p.id, "profile"));
      const ub = el.querySelector("#unblock-btn");
      if (ub) ub.addEventListener("click", () => { S.unblock(p.id); KC.toast(`${esc(p.first)} unblocked`); KC.refresh(); });
      let t;
      el.querySelector("#notes").addEventListener("input", (e) => {
        S.setNote(p.id, e.target.value);
        const s = el.querySelector("#saved"); s.classList.add("show");
        clearTimeout(t); t = setTimeout(() => s.classList.remove("show"), 1200);
      });
      const listBtn = el.querySelector("#list-btn");
      if (listBtn) listBtn.addEventListener("click", () => {
        if (S.onList(p.id)) S.removeFromList(p.id); else { S.addToList(p.id); KC.toast(`${esc(p.first)} added to People I Want to Meet`); }
        listBtn.textContent = S.onList(p.id) ? "✓ On my list" : "+ Add to my list";
      });
      const metBtn = el.querySelector("#met-btn");
      if (metBtn) metBtn.addEventListener("click", () => {
        S.markMet(p.id, "in person");
        KC.go("profile", { id: p.id, justMet: true }, { replace: true });
        KC.toast(`<strong>${esc(p.first)} unlocked</strong> · You've met ${S.metCount()} of ${D.CLASS_SIZE}`);
      });
      el.querySelectorAll("[data-status]").forEach((b) => b.addEventListener("click", () => {
        S.setStatus(p.id, b.dataset.status);
        if (b.dataset.status === "keep") { KC.ensureThread(p.id); KC.toast(`I'll remind you to follow up with ${esc(p.first)}`); }
        KC.go("profile", { id: p.id }, { replace: true });
      }));
      const msg = el.querySelector("#msg-btn");
      if (msg) msg.addEventListener("click", () => { KC.ensureThread(p.id); KC.go("chat", { id: p.id }); });
    },
  });

  // ---------- QR code (deterministic fake) ----------
  function qrSvg(seed, size) {
    const N = 25; let a = seed;
    const r = () => { a = (a * 1103515245 + 12345) & 0x7fffffff; return a / 0x7fffffff; };
    const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3"/>`;
    const inFinder = (x, y) => (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
    let cells = "";
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!inFinder(x, y) && r() > 0.52) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${N} ${N}" fill="#1D1A2B" shape-rendering="crispEdges" aria-label="Your QR code">${finder(0, 0)}${finder(N - 7, 0)}${finder(0, N - 7)}${cells}</svg>`;
  }

  // Who the fake scanner "finds": first unmet person on your list, else anyone unmet.
  function scanTarget() {
    const fromList = S.state.list.find((id) => !S.isMet(id) && S.visible(id));
    if (fromList) return fromList;
    const unmet = D.STUDENTS.filter((p) => !S.isMet(p.id) && S.visible(p.id));
    return unmet[Math.floor(Math.random() * unmet.length)].id;
  }

  // ---------- Scan ----------
  KC.screen("scan", {
    tab: "scan",
    render(params, el) {
      const mode = params.mode || "mine";
      const result = params.result && D.byId[params.result];
      let middle;
      if (result) {
        const pct = (S.metCount() / D.CLASS_SIZE) * 100, before = ((S.metCount() - 1) / D.CLASS_SIZE) * 100;
        middle = `
          <div style="padding:20px;display:flex;justify-content:center">
            <div class="qr-box" style="flex-direction:column;gap:10px">${avatar(result, 96, { serif: true, fontSize: 32, cls: "unlock" })}
              <div style="font-size:13px;color:var(--muted)">Scanned · ${esc(result.first)}'s code</div></div>
          </div>
          <div class="card" style="margin:0 20px;border-radius:20px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px">
            <div style="display:flex;align-items:center;gap:16px">
              <div class="av" style="width:64px;height:64px;font-size:20px">${esc(result.initials)}</div>
              <svg width="40" height="16" viewBox="0 0 40 16" fill="none" stroke="#5E5970" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 8h34M30 2l6 6-6 6"/></svg>
              <div class="av met unlock" style="width:64px;height:64px;font-size:20px;background:${result.color};box-shadow:0 0 0 4px #FBE4EB" id="unlocked-av">${esc(result.initials)}</div>
            </div>
            <h2 style="font-size:20px">${esc(result.first)} unlocked</h2>
            <div style="font-size:14px;color:var(--muted)">You've met ${S.metCount()} of ${D.CLASS_SIZE} classmates</div>
            <div class="progress"><div id="bar" style="width:${before}%"></div></div>
            <div style="display:flex;gap:8px;width:100%;margin-top:4px">
              <button class="btn ghost small" style="flex-grow:1" id="again">Scan another</button>
              <button class="btn primary small" style="flex-grow:1" id="view">View profile</button>
            </div>
          </div>`;
        setTimeout(() => { const bar = el.querySelector("#bar"); if (bar) bar.style.width = Math.max(pct, 1) + "%"; KC.burst(el.querySelector("#unlocked-av"), [result.color, "#E4577E", "#4E2A84"]); }, 250);
      } else if (mode === "mine") {
        middle = `
          <div style="padding:20px;display:flex;justify-content:center"><div class="qr-box">${qrSvg(7, 190)}</div></div>
          <div style="text-align:center;font-weight:700">${esc(D.ME.first)} ${esc(D.ME.last)}</div>
          <div style="text-align:center;font-size:13px;color:var(--muted);margin-top:2px">${esc([D.ME.program, D.ME.section].filter(Boolean).join(" · "))}</div>
          <div class="card" style="margin:20px 20px 0;padding:14px 16px;font-size:14px;color:var(--ink-2);line-height:1.45">
            Show this to someone you just met. When either of you scans, you both unlock each other's full profile.</div>
          <div style="text-align:center;margin-top:8px"><button class="linkbtn" id="sim-them">Demo: they scanned my code →</button></div>`;
      } else {
        middle = `
          <div style="padding:20px;display:flex;justify-content:center">
            <div class="qr-box viewfinder" role="img" aria-label="Camera viewfinder">
              <i class="corner" style="top:18px;left:18px;border-right:0;border-bottom:0;border-radius:8px 0 0 0"></i>
              <i class="corner" style="top:18px;right:18px;border-left:0;border-bottom:0;border-radius:0 8px 0 0"></i>
              <i class="corner" style="bottom:18px;left:18px;border-right:0;border-top:0;border-radius:0 0 0 8px"></i>
              <i class="corner" style="bottom:18px;right:18px;border-left:0;border-top:0;border-radius:0 0 8px 0"></i>
              <div class="scanline"></div>
            </div>
          </div>
          <div style="text-align:center;font-size:14px;color:var(--muted)">Point at their code</div>
          <div style="padding:16px 20px 0"><button class="btn primary" style="width:100%" id="sim-scan">Simulate scan</button></div>`;
      }

      el.innerHTML = `
        <div class="head"><h1 class="title">Just met someone?</h1><div class="sub">Scan each other's code. You both unlock.</div></div>
        <div class="seg" role="tablist">
          <button role="tab" data-mode="mine" class="${!result && mode === "mine" ? "on" : ""}">My code</button>
          <button role="tab" data-mode="theirs" class="${result || mode === "theirs" ? "on" : ""}">Scan theirs</button>
        </div>
        ${middle}<div class="grow"></div>`;

      const doScan = () => {
        const id = scanTarget();
        S.markMet(id, "via QR scan");
        KC.go("scan", { mode: "theirs", result: id }, { replace: true });
      };
      el.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => KC.go("scan", { mode: b.dataset.mode }, { replace: true })));
      const sim = el.querySelector("#sim-scan"); if (sim) sim.addEventListener("click", () => { sim.disabled = true; sim.textContent = "Reading code…"; setTimeout(doScan, 900); });
      const simThem = el.querySelector("#sim-them"); if (simThem) simThem.addEventListener("click", doScan);
      const again = el.querySelector("#again"); if (again) again.addEventListener("click", () => KC.go("scan", { mode: "theirs" }, { replace: true }));
      const view = el.querySelector("#view"); if (view) view.addEventListener("click", () => KC.go("profile", { id: result.id }));
    },
  });
})();

  <script>
/* flow.js */
// flow.js: event alert, "Who did you meet?", keep-in-touch swipe, follow-up chats.

(function () {
  const { D, S, esc, avatar } = window.KC;
  const evById = (id) => D.EVENTS.find((e) => e.id === id);
  const listedGoing = (ev) => ev.attendees.filter((id) => S.onList(id));
  const isEnded = (ev) => S.state.ended.includes(ev.id);
  const firstNames = (ids) => {
    const n = ids.map((id) => D.byId[id].first);
    return n.length <= 2 ? n.join(" and ") : n.slice(0, -1).join(", ") + " and " + n[n.length - 1];
  };

  // ---------- threads + drafts ----------
  const askFor = (slot) => (slot ? `Free ${slot}?` : D.NO_SLOT_ASK);
  function draftFor(id, slot) {
    const p = D.byId[id], m = S.state.met[id] || {};
    const where = m.at && m.at.startsWith("at ") ? " at " + (m.at === "at CIM" ? "CIM" : "the " + m.at.slice(3)) : "";
    return D.DRAFT.replace("{first}", p.first).replace("{where}", where)
      .replace("{topic}", D.lcFirst(p.openTo[0])).replace("{ask}", askFor(slot));
  }
  KC.draftFor = draftFor;
  KC.ensureThread = function (id) {
    if (!S.state.threads[id]) {
      const slot = S.state.calendar ? D.FREE_SLOTS[1] : null;
      S.state.threads[id] = { slot, draft: draftFor(id, slot), messages: [], created: Date.now() };
      S.save();
    }
    return S.state.threads[id];
  };
  const threadIds = () => Object.keys(S.state.threads).filter((id) => !S.isBlocked(id));
  KC.unsentCount = () => threadIds().filter((id) => !S.state.threads[id].messages.length).length;
  KC.eventAlertCount = () => D.EVENTS.filter((e) => !isEnded(e) && listedGoing(e).length).length;

  // ---------- Events ----------
  const SOURCE_STYLE = {
    Partiful: { bg: "linear-gradient(140deg,#FF6B9A 0%,#A24BF0 55%,#3B2A9E 100%)", btn: "#1D1A2B" },
    Luma: { bg: "linear-gradient(160deg,#2B2A33 0%,#4A3F6B 100%)", btn: "#1D1A2B" },
    CampusGroups: { bg: "linear-gradient(160deg,#1E4E8C 0%,#2F6DB5 100%)", btn: "#1E4E8C" },
  };

  KC.screen("events", {
    tab: "events",
    render(params, el) {
      const seg = params.seg || "week";
      const hot = D.EVENTS.filter((e) => !isEnded(e) && listedGoing(e).length)
        .sort((a, b) => listedGoing(b).length - listedGoing(a).length)[0];
      const alertIds = hot ? listedGoing(hot) : [];
      const mine = D.EVENTS.filter((e) => S.state.going.includes(e.id));
      const shown = seg === "going" ? mine : D.EVENTS.slice().sort((a, b) => (b === hot) - (a === hot));
      el.innerHTML = `
        ${hot && seg === "week" ? `<button class="alert" id="alert">
            <div class="stack">${alertIds.slice(0, 3).map((id) => avatar(D.byId[id], 36, { border: "#1D1A2B", fontSize: 12 })).join("")}</div>
            <div style="font-size:14px;line-height:1.35"><strong>${alertIds.length} ${KC.peopleWord(alertIds.length)} from your list</strong> ${alertIds.length === 1 ? "is" : "are"} going to ${esc(hot.day)}'s ${esc(hot.title.replace(/^Friday /, ""))}</div>
            <span aria-hidden="true" style="margin-left:auto;font-size:22px;opacity:.7">›</span>
          </button>` : ""}
        <div style="padding:${hot && seg === "week" ? "20px" : "12px"} 20px 12px"><h1 class="title">${seg === "going" ? "My RSVPs" : "Upcoming"}</h1>
          ${hot || seg === "going" ? "" : `<div class="sub">Add people on Explore and I'll tell you when they're going somewhere.</div>`}</div>
        <div class="seg" style="margin-bottom:12px">
          <button data-seg="week" class="${seg === "week" ? "on" : ""}">Upcoming</button>
          <button data-seg="going" class="${seg === "going" ? "on" : ""}">Going (${mine.length})</button>
        </div>
        <div class="pad" style="display:flex;flex-direction:column;gap:12px;padding-bottom:16px">
          ${shown.length ? shown.map((ev) => {
            const listed = listedGoing(ev), going = S.state.going.includes(ev.id), ended = isEnded(ev);
            const unmet = ev.attendees.filter((id) => !S.isMet(id) && S.visible(id)).length;
            const who = listed.length ? `${firstNames(listed)} from your list` : `${unmet} you haven't met`;
            return `<div class="card ecard ${ev === hot && seg === "week" ? "hot" : ""}" id="ev-${ev.id}">
              <div class="when">${esc(ev.when)} · ${esc(ev.host)}</div>
              <h2>${esc(ev.title)}</h2>
              <div class="who">${ended ? "Ended · " : ""}${ev.going} going · ${esc(who)}</div>
              ${ended
                ? `<div style="margin-top:12px"><button class="btn primary small" style="width:100%" data-log="${ev.id}">Who did you meet?</button></div>`
                : `<div style="display:flex;gap:8px;margin-top:12px">
                    <button class="btn small ${going ? "outline" : "primary"}" style="flex-grow:1" data-go="${ev.id}" aria-pressed="${going}">${going ? "✓ Going" : "I'm going"}</button>
                    <button class="btn ghost small" data-who="${ev.id}">Who's going</button>
                  </div>`}
              <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
                <button class="linkbtn" style="font-size:13px;padding:0" data-invite="${ev.id}">View invite on ${esc(ev.source)} ↗</button>
                ${going && !ended ? `<button class="linkbtn" style="font-size:12px;color:var(--muted);padding:0" data-end="${ev.id}">Demo: after event →</button>` : ""}
              </div>
            </div>`;
          }).join("") : `<div class="empty">Nothing yet. Tap <strong>I'm going</strong> on an event and it shows up here with a link back to the invite.</div>`}
        </div>`;

      const a = el.querySelector("#alert");
      if (a) a.addEventListener("click", () => KC.eventAlertSheet(hot.id));
      el.querySelectorAll("[data-seg]").forEach((b) => b.addEventListener("click", () => KC.go("events", { seg: b.dataset.seg }, { replace: true })));
      el.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => {
        const id = b.dataset.go, g = S.state.going;
        if (g.includes(id)) g.splice(g.indexOf(id), 1); else { g.push(id); KC.toast(`You're going to ${esc(evById(id).title)}. I'll ask who you met after.`); }
        S.save(); KC.refresh();
      }));
      el.querySelectorAll("[data-who]").forEach((b) => b.addEventListener("click", () => {
        const ev = evById(b.dataset.who);
        const rank = (id) => (S.onList(id) ? 0 : S.isMet(id) ? 2 : 1);
        const ids = ev.attendees.filter(S.visible).sort((x, y) => rank(x) - rank(y));
        KC.sheet(`Who's going · ${ev.going}`, `<div style="font-size:13px;color:var(--muted);margin-bottom:8px">Showing classmates who RSVP'd publicly.</div>` +
          ids.map((id) => { const p = D.byId[id]; return `<button class="sheet-row" data-p="${id}" style="gap:12px;justify-content:flex-start;min-height:60px">${avatar(p, 40)}<span style="flex-grow:1">${esc(p.name)}<br><span class="ct">${S.onList(id) ? "On your list" : S.isMet(id) ? esc(KC.metLine(p)) : "Not met yet"}</span></span></button>`; }).join(""),
          (body, close) => body.querySelectorAll("[data-p]").forEach((r) => r.addEventListener("click", () => { close(); KC.go("profile", { id: r.dataset.p }); })));

      el.querySelectorAll("[data-invite]").forEach((b) => b.addEventListener("click", () => KC.openInvite(b.dataset.invite)));

        S.state.ended.push(b.dataset.end); S.save(); KC.go("whomet", { event: b.dataset.end });
      }));

              ${ended ? "" : `<button class="btn small" id="rsvp" style="background:${going ? "#fff" : st.btn};color:${going ? "var(--ink)" : "#fff"};border:${going ? "1px solid var(--line-2)" : "none"}">${going ? "Can't go" : "RSVP · Going"}</button>`}
